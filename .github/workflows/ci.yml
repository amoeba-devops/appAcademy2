name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Backend — unit + lint + typecheck (fast, no DB)
  # ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint, Typecheck, Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx eslint 'src/**/*.ts'

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit Test (with coverage)
        run: npm run test:cov -- --passWithNoTests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────
  # Backend integration — ACM Testcontainers integration suites
  # ──────────────────────────────────────────────────────────────────
  backend-integration:
    name: Backend — Integration (PostgreSQL Testcontainers)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --legacy-peer-deps

      # 통합 테스트 공통 설정(test/integration/acm/setup.ts)은 pg_bigm 이 든 운영과 같은 이미지를
      # 쓴다(never-pull). CI 에서 직접 빌드하고 GHA 캐시로 재사용한다.
      - uses: docker/setup-buildx-action@v4
      - name: Build ACM Postgres test image (pg_bigm)
        uses: docker/build-push-action@v7
        with:
          context: docker/production
          file: docker/production/Dockerfile.postgres-acm
          tags: tac-postgres-acm:pg16-bigm
          load: true
          cache-from: type=gha,scope=postgres-acm
          cache-to: type=gha,mode=max,scope=postgres-acm

      # REQ-261017 — 새 환경 구축 검사: 빈 DB 에 sql/acm 전체를 배포와 같은 순서·psql 로 적용.
      # 새 마이그레이션이 순서를 깨거나 빈 DB 에서 실패하면 여기서 막힌다.
      - name: Fresh install (empty DB) migration check
        working-directory: .
        run: |
          docker run -d --name acm-fresh -e POSTGRES_PASSWORD=t -e POSTGRES_DB=db_acm tac-postgres-acm:pg16-bigm
          for i in $(seq 1 30); do docker exec acm-fresh pg_isready -U postgres -d db_acm && break; sleep 2; done
          sleep 2
          for f in $(bash scripts/acm-migration-order.sh sql/acm); do
            echo "apply $(basename "$f")"
            docker exec -i acm-fresh psql -q -U postgres -d db_acm -v ON_ERROR_STOP=1 < "$f"
          done
          docker rm -f acm-fresh

      - name: e2e (Nest AppModule boot)
        run: npm run test:e2e
        # TEMP: marked non-blocking until CI gains full ACM_PG_* and ACM_PII_KEY env.
        continue-on-error: true

      # 필수 단계: 실패하면 PR 이 막힌다(이전에는 continue-on-error 로 실패가 가려졌다).
      - name: ACM integration (Testcontainers)
        run: npx jest --config ./test/jest-int.json --runInBand

  # ──────────────────────────────────────────────────────────────────
  # Frontend-acm — lint + typecheck + build
  # ──────────────────────────────────────────────────────────────────
  frontend-acm:
    name: Frontend-acm — Lint, Typecheck, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-acm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-acm/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-acm-build
          path: |
            frontend-acm/dist/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────
  # Docker image build validation (no push) — catches Dockerfile drift
  # ──────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { name: backend,  context: ./backend,  dockerfile: ./backend/Dockerfile }
          - { name: frontend-acm, context: ./frontend-acm, dockerfile: ./frontend-acm/Dockerfile }

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: false
          load: true
          tags: tac-${{ matrix.target.name }}:ci
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,scope=${{ matrix.target.name }},mode=max

      - name: Trivy vulnerability scan (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tac-${{ matrix.target.name }}:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ──────────────────────────────────────────────────────────────────
  # Filesystem secret/dependency scan
  # ──────────────────────────────────────────────────────────────────
  trivy-fs:
    name: Trivy — FS Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-dirs: node_modules,frontend-acm/dist,backend/dist
