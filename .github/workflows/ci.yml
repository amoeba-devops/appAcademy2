name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Backend — unit + lint + typecheck (fast, no DB)
  # ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint, Typecheck, Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx eslint 'src/**/*.ts'

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit Test (with coverage)
        run: npm run test:cov -- --passWithNoTests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────
  # Backend integration — ACM Testcontainers integration suites
  # ──────────────────────────────────────────────────────────────────
  backend-integration:
    name: Backend — Integration (PostgreSQL Testcontainers)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: e2e (Nest AppModule boot)
        run: npm run test:e2e
        # TEMP: marked non-blocking until CI gains full ACM_PG_* and ACM_PII_KEY env.
        continue-on-error: true

      - name: ACM integration (Testcontainers)
        run: npx jest --config ./test/jest-int.json --runInBand
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────
  # Frontend-acm — lint + typecheck + build
  # ──────────────────────────────────────────────────────────────────
  frontend-acm:
    name: Frontend-acm — Lint, Typecheck, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-acm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-acm/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-acm-build
          path: |
            frontend-acm/dist/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────
  # Docker image build validation (no push) — catches Dockerfile drift
  # ──────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { name: backend,  context: ./backend,  dockerfile: ./backend/Dockerfile }
          - { name: frontend-acm, context: ./frontend-acm, dockerfile: ./frontend-acm/Dockerfile }

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: false
          load: true
          tags: tac-${{ matrix.target.name }}:ci
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,scope=${{ matrix.target.name }},mode=max

      - name: Trivy vulnerability scan (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tac-${{ matrix.target.name }}:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ──────────────────────────────────────────────────────────────────
  # Filesystem secret/dependency scan
  # ──────────────────────────────────────────────────────────────────
  trivy-fs:
    name: Trivy — FS Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-dirs: node_modules,frontend-acm/dist,backend/dist
