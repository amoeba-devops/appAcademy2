name: CD — Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Override SHA to deploy (defaults to current ref).'
        required: false
        type: string

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. Build + push backend & frontend images to GHCR
  # ──────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      image_base: ${{ steps.meta.outputs.image_base }}

    strategy:
      matrix:
        target:
          - { name: tac-backend,   context: ./backend,      dockerfile: ./backend/Dockerfile }
          - { name: acm-frontend,  context: ./frontend-acm, dockerfile: ./frontend-acm/Dockerfile }

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - id: meta
        name: Compute short SHA + lowercase image base
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.target.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_base }}/${{ matrix.target.name }}:${{ steps.meta.outputs.sha_short }}
            ${{ steps.meta.outputs.image_base }}/${{ matrix.target.name }}:staging
          cache-from: type=gha,scope=cd-${{ matrix.target.name }}
          cache-to: type=gha,scope=cd-${{ matrix.target.name }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  # ──────────────────────────────────────────────────────────────────
  # 2. SSH to staging host and trigger redeploy script
  # ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: staging
      url: https://acm-stg.amoeba.site

    steps:
      - name: Trigger remote deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host:     ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_SSH_PORT || 22 }}
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            export DEPLOY_SHA='${{ needs.build-push.outputs.sha_short }}'
            cd ~/app-academy
            scripts/deploy-staging.sh

      - name: Smoke test (canonical host)
        run: |
          for i in $(seq 1 6); do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 15 https://acm-stg.amoeba.site/ || echo 000)
            echo "attempt $i → $code"
            [[ "$code" == "200" ]] && break
            sleep 5
            [[ "$i" == "6" ]] && { echo "Smoke test failed"; exit 1; }
          done
