version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    ignore:
      # FIX-260719 — typeorm 1.0/TS 6.0 자동머지로 main CI 파손. major 는 수동 검토.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      typeorm:
        patterns:
          - typeorm

  - package-ecosystem: npm
    directory: /frontend-acm
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      radix-ui:
        patterns:
          - '@radix-ui/*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, root]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
