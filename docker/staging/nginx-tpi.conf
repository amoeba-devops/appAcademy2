# /etc/nginx/sites-available/tpi.amoeba.site
# Trinity Prep Institute marketing landing — mirror of tpi.co.kr served from
# the acm-frontend container's static slot (/usr/share/nginx/html/web/).
#
# History:
#   - 2026-04: this vhost issued a 301 → app-academy-stg.amoeba.site (sunset
#     placeholder during AMA App Store pivot).
#   - 2026-05-07: repurposed to serve the cloned tpi.co.kr landing from
#     frontend-acm/public/web. acm-stg.amoeba.site continues to serve the SPA
#     from the same container; host header disambiguates the two vhosts.
#
# Routing model:
#   - All requests are internally prefixed with /web/ before being proxied to
#     the acm-frontend container on 127.0.0.1:5174. The browser URL stays
#     clean (e.g. tpi.amoeba.site/contact.html), but the container sees
#     /web/contact.html and serves the static file from its dist/web/ tree.
#
# Installation (handled by scripts/deploy-staging.sh):
#   sudo cp docker/staging/nginx-tpi.conf /etc/nginx/sites-available/tpi.amoeba.site
#   sudo ln -sf /etc/nginx/sites-available/tpi.amoeba.site \
#               /etc/nginx/sites-enabled/tpi.amoeba.site
#   sudo nginx -t && sudo systemctl reload nginx

# --- HTTP :80 → 301 to HTTPS ------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tpi.amoeba.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 → /web/ prefix proxy to acm-frontend container --------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tpi.amoeba.site;

    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/amoeba.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoeba.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=300" always;

    # Internally rewrite every URI to /web/<path> before forwarding. The
    # acm-frontend container's nginx serves static files out of
    # /usr/share/nginx/html, so /web/index.html resolves to the mirrored
    # landing. The SPA fallback (try_files ... /index.html) inside the
    # container is bypassed because /web/*.html exists.
    location / {
        rewrite ^/$        /web/index.html break;
        rewrite ^/(.+)$    /web/$1        break;

        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
