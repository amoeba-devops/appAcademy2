# /etc/nginx/sites-available/tpi.amoeba.site
# Legacy hostname for the Trinity Academy demo deployment.
# As of 2026-04 (AMA App Store pivot S4) this vhost serves a transparent
# 301 redirect to the new canonical hostname app-academy-stg.amoeba.site.
# To revert to the previous direct-proxy behavior, restore the `location /`
# block from git history.
#
# Installation:
#   sudo cp docker/staging/nginx-tpi.conf /etc/nginx/sites-available/tpi.amoeba.site
#   sudo rm -f /etc/nginx/sites-enabled/tdi.amoeba.site           # retire the typo'd sibling
#   sudo ln -sf /etc/nginx/sites-available/tpi.amoeba.site \
#               /etc/nginx/sites-enabled/tpi.amoeba.site
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sunset: 6 months after cut-over (T+6mo). Remove this file then.

# --- HTTP :80 → 301 to canonical HTTPS host ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tpi.amoeba.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://app-academy-stg.amoeba.site$request_uri;
    }
}

# --- HTTPS :443 → 301 to canonical host --------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tpi.amoeba.site;

    ssl_certificate     /etc/letsencrypt/live/amoeba.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoeba.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://app-academy-stg.amoeba.site$request_uri;
}
