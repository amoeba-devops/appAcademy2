# /etc/nginx/sites-available/tpi.amoeba.site
# Host nginx — proxies tpi.amoeba.site to the dockerized frontend/backend.
# Installation:
#   sudo cp docker/staging/nginx-tpi.conf /etc/nginx/sites-available/tpi.amoeba.site
#   sudo rm -f /etc/nginx/sites-enabled/tdi.amoeba.site           # retire the typo'd sibling
#   sudo ln -sf /etc/nginx/sites-available/tpi.amoeba.site \
#               /etc/nginx/sites-enabled/tpi.amoeba.site
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name tpi.amoeba.site;

    client_max_body_size 20M;

    # Backend API traffic goes straight to the NestJS container, bypassing
    # the Next.js server to avoid the extra rewrite hop.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else → Next.js frontend container.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
