# /etc/nginx/sites-available/tpi.amoeba.site
# Host nginx — proxies tpi.amoeba.site to the dockerized frontend/backend.
# Installation:
#   sudo cp docker/staging/nginx-tpi.conf /etc/nginx/sites-available/tpi.amoeba.site
#   sudo rm -f /etc/nginx/sites-enabled/tdi.amoeba.site           # retire the typo'd sibling
#   sudo ln -sf /etc/nginx/sites-available/tpi.amoeba.site \
#               /etc/nginx/sites-enabled/tpi.amoeba.site
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: serves tpi.amoeba.site via the *.amoeba.site wildcard cert installed
# at /etc/letsencrypt/live/amoeba.site/. Adjust ssl_certificate paths below
# if the cert was deployed at a different location.

# --- HTTP :80 --- ACME renewal passthrough + permanent redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tpi.amoeba.site;

    # Keep Let's Encrypt HTTP-01 renewals working even though the wildcard
    # uses DNS-01 — harmless if unused, saves a 404 loop if we ever fall back.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 --- actual app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tpi.amoeba.site;

    client_max_body_size 20M;

    # *.amoeba.site wildcard (adjust path if cert was installed elsewhere)
    ssl_certificate     /etc/letsencrypt/live/amoeba.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoeba.site/privkey.pem;

    # Mozilla "intermediate" profile — TLS 1.2+/1.3, no weak ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Conservative HSTS for staging (5 min, no preload, no includeSubDomains).
    # Bumped to a year only after production cutover.
    add_header Strict-Transport-Security "max-age=300" always;

    # All traffic → Next.js. The Next.js rewrites in frontend/next.config.mjs
    # dispatch /api/auth/* and /api/portal/* to internal handlers (NextAuth,
    # Portal API routes) and forward the remaining /api/* to the NestJS
    # backend container via API_PROXY_URL. Splitting /api/ at nginx level
    # bypasses those internal handlers and breaks NextAuth/Portal flows.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
