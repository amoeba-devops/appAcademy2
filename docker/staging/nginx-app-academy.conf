# /etc/nginx/sites-available/app-academy-stg.amoeba.site
# Host nginx — proxies app-academy-stg.amoeba.site to the dockerized
# frontend/backend stack. Lives alongside nginx-tpi.conf during the
# tpi → app-academy domain transition (S4 of AMA App Store pivot).
#
# Installation (handled by scripts/deploy-staging.sh):
#   sudo cp docker/staging/nginx-app-academy.conf \
#          /etc/nginx/sites-available/app-academy-stg.amoeba.site
#   sudo ln -sf /etc/nginx/sites-available/app-academy-stg.amoeba.site \
#               /etc/nginx/sites-enabled/app-academy-stg.amoeba.site
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: served by the *.amoeba.site wildcard cert at
# /etc/letsencrypt/live/amoeba.site/.

# --- HTTP :80 → 301 to HTTPS -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app-academy-stg.amoeba.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 --- main app -------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app-academy-stg.amoeba.site;

    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/amoeba.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoeba.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=300" always;

    # AMA subscription webhook — Toss/AMA may send larger payloads.
    location /api/webhooks/ama/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep raw body for HMAC verification (Next proxy → NestJS).
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
