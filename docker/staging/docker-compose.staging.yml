# Trinity Academy — Staging stack
# Host: appacademy@125.133.49.165 (tpi.amoeba.site)
# Usage:
#   docker compose -f docker/staging/docker-compose.staging.yml \
#                  --env-file docker/staging/.env.staging \
#                  up -d
services:
  postgres-acm:
    build:
      context: .
      dockerfile: Dockerfile.postgres-acm
    image: tac-postgres-acm:pg16-bigm
    container_name: tac-postgres-acm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ACM_PG_DATABASE:-db_acm}
      POSTGRES_USER: ${ACM_PG_USER:-acm}
      POSTGRES_PASSWORD: ${ACM_PG_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ${DATA_DIR:-./data}/postgres-acm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${ACM_PG_USER:-acm}", "-d", "${ACM_PG_DATABASE:-db_acm}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: tac-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # REQ-260626 T-06 / ADR-008 — CSL attachment object store (MinIO).
  # Self-hosted S3-compatible. Backend talks to it via @aws-sdk/client-s3
  # with forcePathStyle. Bucket auto-created via the small init container
  # below on first boot; thereafter idempotent.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tac-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ACM_S3_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${ACM_S3_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ${DATA_DIR:-./data}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: tac-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set tac http://minio:9000 "$$ACM_S3_ROOT_USER" "$$ACM_S3_ROOT_PASSWORD" &&
        mc mb -p tac/${ACM_S3_BUCKET:-acm-attachments} || true
    environment:
      ACM_S3_ROOT_USER: ${ACM_S3_ROOT_USER}
      ACM_S3_ROOT_PASSWORD: ${ACM_S3_ROOT_PASSWORD}
      ACM_S3_BUCKET: ${ACM_S3_BUCKET:-acm-attachments}
    restart: "no"

  backend:
    # When DEPLOY_SHA is set, this resolves to the GHCR image pushed by
    # CD; falls back to the local build context for ad-hoc rebuilds.
    image: ${BACKEND_IMAGE:-ghcr.io/amoeba-devops/appacademy2/tac-backend:${DEPLOY_SHA:-staging}}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: tac-backend
    restart: unless-stopped
    # NOTE: minio is intentionally NOT in depends_on. Backend has a graceful
    # `ObjectStoreClient.isConfigured()` fallback that returns 503 on attachment
    # endpoints when MinIO env is missing — this keeps the rest of the app
    # bootable when the operator hasn't run scripts/setup-minio-env.sh yet
    # (FIX after PR #79 hard-depends_on broke production /api/* with 502).
    depends_on:
      redis:
        condition: service_healthy
      postgres-acm:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      # ACM v1.0a — separate Postgres datasource (ACM_DS = 'acm-pg')
      ACM_PG_HOST: postgres-acm
      ACM_PG_PORT: 5432
      ACM_PG_USER: ${ACM_PG_USER:-acm}
      ACM_PG_PASSWORD: ${ACM_PG_PASSWORD}
      ACM_PG_DATABASE: ${ACM_PG_DATABASE:-db_acm}
      ACM_PII_KEY: ${ACM_PII_KEY}
      ACM_JWT_SECRET: ${ACM_JWT_SECRET}
      ACM_JWT_EXPIRES_IN: ${ACM_JWT_EXPIRES_IN:-12h}
      # AMA SSO verification mode — 'local_config' = verify Custom App/Category
      # tokens with the per-tenant secret from /admin/config (REQ-260609D, the
      # mode this deployment uses); 'ama_session' = OAuth gateway exchange +
      # introspect; 'local' = legacy HS256 self-verify (AMA_JWT_SECRET).
      # Default local_config so a missing .env value does not silently fall back
      # to 'local' and reject Custom Category logins with 401 (FIX-260630).
      AMA_TOKEN_VERIFY_MODE: ${AMA_TOKEN_VERIFY_MODE:-local_config}
      AMA_GATEWAY_URL: ${AMA_GATEWAY_URL:-https://api.amoeba.site}
      AMA_CLIENT_ID: ${AMA_CLIENT_ID:-}
      AMA_CLIENT_SECRET: ${AMA_CLIENT_SECRET:-}
      AMA_OAUTH_TIMEOUT_MS: ${AMA_OAUTH_TIMEOUT_MS:-5000}
      # AMA platform directory API (REQ-260604 / FIX-260619) — powers the
      # /admin/tch + /admin/stf AMA member picker. Used regardless of
      # AMA_TOKEN_VERIFY_MODE. Without these the directory client silently
      # defaults to mock and the picker returns fake fixtures / no results.
      AMA_SERVICES_MODE: ${AMA_SERVICES_MODE:-mock}
      AMA_PLATFORM_BASE_URL: ${AMA_PLATFORM_BASE_URL:-https://ama.amoeba.site}
      AMA_PLATFORM_SERVICE_TOKEN: ${AMA_PLATFORM_SERVICE_TOKEN:-}
      AMA_PLATFORM_TIMEOUT_MS: ${AMA_PLATFORM_TIMEOUT_MS:-3000}
      # AMA Custom App SSO (HS256 JWT passthrough — local mode only)
      AMA_JWT_SECRET: ${AMA_JWT_SECRET:-}
      AMA_JWT_ALLOWED_APP_CODES: ${AMA_JWT_ALLOWED_APP_CODES:-tpi-acm}
      # AMA App Store integration
      AMA_WEBHOOK_SECRET: ${AMA_WEBHOOK_SECRET:-}
      AMA_DEPROVISION_GRACE_DAYS: ${AMA_DEPROVISION_GRACE_DAYS:-90}
      FRONTEND_URL: ${FRONTEND_URL:-https://app-academy-stg.amoeba.site}
      BACKEND_URL: ${BACKEND_URL:-https://app-academy-stg.amoeba.site}
      # ACM file uploads (REQ-260510 teacher resume etc.)
      ACM_UPLOAD_DIR: /app/uploads
      # REQ-260626 T-06 / ADR-008 — CSL attachment object store (MinIO)
      ACM_S3_ENDPOINT: ${ACM_S3_ENDPOINT:-http://minio:9000}
      ACM_S3_REGION: ${ACM_S3_REGION:-us-east-1}
      ACM_S3_BUCKET: ${ACM_S3_BUCKET:-acm-attachments}
      ACM_S3_FORCE_PATH_STYLE: ${ACM_S3_FORCE_PATH_STYLE:-true}
      ACM_S3_ACCESS_KEY_ID: ${ACM_S3_ROOT_USER}
      ACM_S3_SECRET_ACCESS_KEY: ${ACM_S3_ROOT_PASSWORD}
      # BODA(보다에듀) integration (REQ-260526) + demo mode (REQ-260610)
      BODA_MODE: ${BODA_MODE:-mock}
      BODA_CRYPTO_KEY: ${BODA_CRYPTO_KEY:-}
      BODA_DEFAULT_ROOM_CODE: ${BODA_DEFAULT_ROOM_CODE:-r-tac-demo}
      # Enable `?demo=1` flow + simulate-event admin endpoint on staging only.
      # MUST be unset/false in production.
      BODA_SIMULATE_ENABLED: ${BODA_SIMULATE_ENABLED:-false}
    volumes:
      - ${DATA_DIR:-./data}/acm-uploads:/app/uploads
    ports:
      - "127.0.0.1:4000:4000"

  # Legacy `frontend` (Next.js) removed 2026-06-04 — directory was archived
  # in PLN-260519 Phase 7 (commit 4a6178f) and CI no longer builds
  # tac-frontend, so `docker compose pull` and a fallback build both fail.
  # The Vite SPA in `frontend-acm` is the canonical user entrypoint via the
  # acm-stg.amoeba.site vhost. Old running tac-frontend container can be
  # stopped manually after first successful deploy:
  #   docker stop tac-frontend && docker rm tac-frontend

  # ACM v1.0a Vite SPA, served by the image's own nginx. The image bakes
  # the SPA bundle plus an /api/* → backend:4000 proxy (see
  # frontend-acm/nginx.conf), so this container reuses the shared NestJS
  # backend service on the compose network — no separate ACM API.
  # Host nginx (acm-stg.amoeba.site vhost) terminates TLS and proxies to
  # 127.0.0.1:5174 → this container's :80.
  frontend-acm:
    image: ${ACM_FRONTEND_IMAGE:-ghcr.io/amoeba-devops/appacademy2/acm-frontend:${DEPLOY_SHA:-staging}}
    build:
      context: ../../frontend-acm
      dockerfile: Dockerfile
    container_name: acm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5174:80"
