# Trinity Academy — Staging stack
# Host: appacademy@125.133.49.165 (tpi.amoeba.site)
# Usage:
#   docker compose -f docker/staging/docker-compose.staging.yml \
#                  --env-file docker/staging/.env.staging \
#                  up -d
services:
  mysql:
    image: mysql:8.0
    container_name: tac-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_tac}
      MYSQL_USER: ${MYSQL_USER:-tac}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-acm:
    build:
      context: .
      dockerfile: Dockerfile.postgres-acm
    image: tac-postgres-acm:pg16-bigm
    container_name: tac-postgres-acm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ACM_PG_DATABASE:-db_acm}
      POSTGRES_USER: ${ACM_PG_USER:-acm}
      POSTGRES_PASSWORD: ${ACM_PG_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ${DATA_DIR:-./data}/postgres-acm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${ACM_PG_USER:-acm}", "-d", "${ACM_PG_DATABASE:-db_acm}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: tac-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    # When DEPLOY_SHA is set, this resolves to the GHCR image pushed by
    # CD; falls back to the local build context for ad-hoc rebuilds.
    image: ${BACKEND_IMAGE:-ghcr.io/amoeba-devops/appacademy2/tac-backend:${DEPLOY_SHA:-staging}}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: tac-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-acm:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-tac}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-db_tac}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      # ACM v1.0a — separate Postgres datasource (ACM_DS = 'acm-pg')
      ACM_PG_HOST: postgres-acm
      ACM_PG_PORT: 5432
      ACM_PG_USER: ${ACM_PG_USER:-acm}
      ACM_PG_PASSWORD: ${ACM_PG_PASSWORD}
      ACM_PG_DATABASE: ${ACM_PG_DATABASE:-db_acm}
      ACM_PII_KEY: ${ACM_PII_KEY}
      # AMA App Store integration (S2/S3 of pivot)
      AMA_OIDC_MODE: ${AMA_OIDC_MODE:-mock}
      AMA_OIDC_ISSUER: ${AMA_OIDC_ISSUER:-}
      AMA_OIDC_CLIENT_ID: ${AMA_OIDC_CLIENT_ID:-}
      AMA_OIDC_CLIENT_SECRET: ${AMA_OIDC_CLIENT_SECRET:-}
      AMA_OIDC_REDIRECT_URI: ${AMA_OIDC_REDIRECT_URI:-}
      AMA_WEBHOOK_SECRET: ${AMA_WEBHOOK_SECRET:-}
      AMA_DEPROVISION_GRACE_DAYS: ${AMA_DEPROVISION_GRACE_DAYS:-90}
      FRONTEND_URL: ${FRONTEND_URL:-https://app-academy-stg.amoeba.site}
      BACKEND_URL: ${BACKEND_URL:-https://app-academy-stg.amoeba.site}
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/amoeba-devops/appacademy2/tac-frontend:${DEPLOY_SHA:-staging}}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_URL: http://backend:4000
    container_name: tac-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PROXY_URL: http://backend:4000
      # NextAuth authorize() runs server-side inside this container and
      # fetches the backend directly. Must be reachable from the frontend
      # container's network namespace — not 'localhost'.
      BACKEND_URL: http://backend:4000
      # nginx terminates TLS with the *.amoeba.site wildcard cert and
      # forwards X-Forwarded-Proto=https. NEXTAUTH_URL must match the
      # canonical hostname users see (legacy tpi.amoeba.site 301-redirects
      # to this one as of S4 of the AMA App Store pivot).
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://app-academy-stg.amoeba.site}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://app-academy-stg.amoeba.site}
      FRONTEND_URL: ${FRONTEND_URL:-https://app-academy-stg.amoeba.site}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "127.0.0.1:3000:3000"

  # ACM v1.0a Vite SPA, served by the image's own nginx. The image bakes
  # the SPA bundle plus an /api/* → backend:4000 proxy (see
  # frontend-acm/nginx.conf), so this container reuses the shared NestJS
  # backend service on the compose network — no separate ACM API.
  # Host nginx (acm-stg.amoeba.site vhost) terminates TLS and proxies to
  # 127.0.0.1:5174 → this container's :80.
  frontend-acm:
    image: ${ACM_FRONTEND_IMAGE:-ghcr.io/amoeba-devops/appacademy2/acm-frontend:${DEPLOY_SHA:-staging}}
    build:
      context: ../../frontend-acm
      dockerfile: Dockerfile
    container_name: acm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5174:80"
