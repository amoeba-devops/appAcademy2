# /etc/nginx/sites-available/acm-stg.amoeba.site
# Host nginx — terminates TLS for the ACM v1.0a SPA and proxies to the
# dockerized acm-frontend container (which serves the Vite bundle and
# proxies /api/* to the shared NestJS backend on the same compose
# network). Companion to nginx-app-academy.conf and nginx-tpi.conf.
#
# Installation (handled by scripts/deploy-staging.sh):
#   sudo cp docker/staging/nginx-acm.conf \
#          /etc/nginx/sites-available/acm-stg.amoeba.site
#   sudo ln -sf /etc/nginx/sites-available/acm-stg.amoeba.site \
#               /etc/nginx/sites-enabled/acm-stg.amoeba.site
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: served by the *.amoeba.site wildcard cert at
# /etc/letsencrypt/live/amoeba.site/.
# DNS: A record for acm-stg.amoeba.site → 125.133.49.165 (manual).

# --- HTTP :80 → 301 to HTTPS -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name acm-stg.amoeba.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 --- ACM SPA --------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acm-stg.amoeba.site;

    client_max_body_size 55M;

    ssl_certificate     /etc/letsencrypt/live/amoeba.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoeba.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=300" always;

    # AMA Custom App SSO — allow ACM to be embedded as <iframe> from the
    # AMA portal (production + staging hosts). Modern browsers honour
    # frame-ancestors and ignore X-Frame-Options when CSP is present.
    # @see docs/analysis/ACM-AMA-SSO-REQ-1.0.0.md FR-AMA-40
    add_header Content-Security-Policy "frame-ancestors 'self' https://ama.amoeba.site https://ama-stg.amoeba.site" always;

    # All traffic → acm-frontend container's nginx on :5174 (loopback). The
    # container itself terminates the SPA + /api/* → backend:4000 proxy on
    # the compose network.
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
