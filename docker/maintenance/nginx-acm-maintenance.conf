# Maintenance vhost for ACM service windows.
#
# Swaps in for `nginx-acm.conf` during a maintenance window. All routes serve
# the static 503 page below; nginx reload is instant so operator can flip in < 1s.
#
# Install (from the runbook):
#   sudo cp docker/maintenance/nginx-acm-maintenance.conf \
#           /etc/nginx/sites-available/acm-maintenance.conf
#   sudo cp docker/maintenance/maintenance.html /var/www/maintenance/
#   sudo ln -sf /etc/nginx/sites-available/acm-maintenance.conf \
#               /etc/nginx/sites-enabled/acm.amoeba.site   # replaces main link
#   sudo nginx -t && sudo systemctl reload nginx
#
# Restore (post-cutover): re-link the original nginx-acm.conf + reload.

# --- HTTP :80 → 301 to HTTPS (unchanged) -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name acm.amoeba.site acm-stg.amoeba.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — every request returns the 503 maintenance page -------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acm.amoeba.site acm-stg.amoeba.site;

    # Same certs as the live vhost — swap the sites-enabled symlink only.
    # Production:
    ssl_certificate     /etc/letsencrypt/live/acm.amoeba.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acm.amoeba.site/privkey.pem;
    # Staging fallback (comment out one of the two):
    # ssl_certificate     /etc/letsencrypt/live/amoeba.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/amoeba.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Retry-After "600" always;

    root /var/www/maintenance;
    index maintenance.html;

    # Health probe for GitHub Actions cd-* smoke tests — DO respond 200
    # so `curl -w '%{http_code}'` doesn't panic during the window. The
    # smoke check compares to 200 or 503; keeping /api/health at 200
    # lets the automation continue to detect "reachable" separately from
    # the app being up.
    location = /api/health {
        default_type application/json;
        return 200 '{"success":true,"data":{"status":"maintenance","service":"trinity-academy-api","note":"cutover in progress"}}';
    }

    # Everything else → 503 with the maintenance HTML body.
    location / {
        return 503;
    }
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
    }
}
