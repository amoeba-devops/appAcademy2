# /etc/nginx/sites-available/app-academy.amoeba.site
# Production vhost for app-academy. Mirrors docker/staging/nginx-app-academy.conf
# but with production-grade HSTS (1 year + includeSubDomains + preload).
#
# Installation: handled by scripts/deploy-production.sh

# --- HTTP :80 → 301 to HTTPS -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app-academy.amoeba.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 --- main app -------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app-academy.amoeba.site;

    client_max_body_size 55M;

    ssl_certificate     /etc/letsencrypt/live/amoeba.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoeba.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Production HSTS — 1y, includeSubDomains, preload.
    # Once set, browsers will REFUSE plain-HTTP for 1 year. Do not enable
    # until you are 100% sure all subdomains serve HTTPS only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # AMA subscription webhook — preserve raw body for HMAC verification.
    location /api/webhooks/ama/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
