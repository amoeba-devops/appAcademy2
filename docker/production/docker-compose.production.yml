# app-academy — Production stack
# Host: production server (hostname/IP set out-of-band)
# Usage:
#   docker compose -f docker/production/docker-compose.production.yml \
#                  --env-file docker/production/.env.production \
#                  up -d
#
# This file mirrors docker/staging/ with prod-only differences:
#   - container names prefixed `tac-prod-`
#   - canonical host: app-academy.amoeba.site (no -stg suffix)
#   - HSTS bumped to 1y in nginx (see nginx-production.conf)
#   - data lives under /var/lib/app-academy/ by default

services:
  mysql:
    image: mysql:8.0
    container_name: tac-prod-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_tac}
      MYSQL_USER: ${MYSQL_USER:-tac}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ${DATA_DIR:-/var/lib/app-academy}/mysql:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tac-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${DATA_DIR:-/var/lib/app-academy}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/amoeba-devops/appacademy2/tac-backend:${DEPLOY_SHA:-production}}
    container_name: tac-prod-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-tac}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-db_tac}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      AMA_OIDC_MODE: ${AMA_OIDC_MODE:-http}
      AMA_OIDC_ISSUER: ${AMA_OIDC_ISSUER}
      AMA_OIDC_CLIENT_ID: ${AMA_OIDC_CLIENT_ID}
      AMA_OIDC_CLIENT_SECRET: ${AMA_OIDC_CLIENT_SECRET}
      AMA_OIDC_REDIRECT_URI: ${AMA_OIDC_REDIRECT_URI:-https://app-academy.amoeba.site/api/auth/ama/callback}
      AMA_WEBHOOK_SECRET: ${AMA_WEBHOOK_SECRET}
      AMA_DEPROVISION_GRACE_DAYS: ${AMA_DEPROVISION_GRACE_DAYS:-90}
      FRONTEND_URL: ${FRONTEND_URL:-https://app-academy.amoeba.site}
      BACKEND_URL: ${BACKEND_URL:-https://app-academy.amoeba.site}
      ACM_UPLOAD_DIR: /app/uploads
    volumes:
      - ${DATA_DIR:-./data}/acm-uploads:/app/uploads
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/amoeba-devops/appacademy2/tac-frontend:${DEPLOY_SHA:-production}}
    container_name: tac-prod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PROXY_URL: http://backend:4000
      BACKEND_URL: http://backend:4000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://app-academy.amoeba.site}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://app-academy.amoeba.site}
      FRONTEND_URL: ${FRONTEND_URL:-https://app-academy.amoeba.site}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_AMA_APPSTORE_URL: ${NEXT_PUBLIC_AMA_APPSTORE_URL:-https://amoeba.site/apps/app-academy}
    ports:
      - "127.0.0.1:3000:3000"
