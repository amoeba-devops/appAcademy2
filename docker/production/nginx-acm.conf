# /etc/nginx/sites-available/acm.amoeba.site
# Production vhost — ACM v1.0a SPA (frontend-acm container on :5174).
#
# Installation (handled by scripts/deploy-production.sh):
#   sudo cp docker/production/nginx-acm.conf \
#          /etc/nginx/sites-available/acm.amoeba.site
#   sudo ln -sf /etc/nginx/sites-available/acm.amoeba.site \
#               /etc/nginx/sites-enabled/acm.amoeba.site
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: served by the *.amoeba.site wildcard cert at
# /etc/letsencrypt/live/amoeba.site/.
# DNS: A record for acm.amoeba.site → 211.110.140.172 (manual).

# --- HTTP :80 → 301 to HTTPS -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name acm.amoeba.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 --- ACM SPA --------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acm.amoeba.site;

    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/amoeba.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoeba.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Production HSTS — 1y, includeSubDomains, preload.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # AMA Custom App SSO — allow ACM to be embedded as <iframe> from the
    # AMA portal. @see docs/analysis/ACM-AMA-SSO-REQ-1.0.0.md FR-AMA-40
    add_header Content-Security-Policy "frame-ancestors 'self' https://ama.amoeba.site https://ama-stg.amoeba.site" always;

    # AMA subscription webhook — preserve raw body for HMAC verification.
    location /api/webhooks/ama/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # All other traffic → acm-prod-frontend container's nginx on :5174.
    # That container's nginx terminates the SPA + /api/* → backend:4000
    # proxy on the compose network.
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
