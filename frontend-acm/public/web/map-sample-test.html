<script>
const QUESTIONS = [{"no":1,"p1":"[이미지]\n\nThe Pony Express began in 1860. It was a mail service. Horseback riders carried the mail 2,000 miles between Missouri and California. Each horse and rider went about 250 miles and then handed the mail off to the next rider. It was a hard and dangerous trip. However, only one mail delivery was ever lost. The Pony Express was most important during the first few months of the Civil War. People in California wanted to know what was happening in the war. In 1861 a telegraph wire was laid that connected the East and West Coasts. The telegraph could send messages in seconds. So, after just 19 months, the Pony Express ended.","p2":"","gl":"","q":"Why did the Pony Express end?","c":["because the Civil War began","because too much mail was lost","because a telegraph wire was laid","because the trip was too dangerous"]},{"no":2,"p1":"Before writing was invented, people told all their stories out loud. Some of these old stories are about animals. The stories tell why animals look or act the way they do. These kinds of stories are called animal myths.","p2":"Animal myths may tell why birds have colorful feathers. Or they may tell why bears have small tails or why zebras have stripes. In many of these myths, there is one animal that plays tricks on the other animals.","gl":"","q":"What is the topic of both passages? (JZ2)","c":["the reason animals have stripes","the people who told animal myths","the tricks animals play on each other","the kinds of stories called animal myths"]},{"no":3,"p1":"Jumping rope is the exercise that's come off the playground and into the training programs of everyone from boxers to ballet dancers. Almost anybody can make, find, or buy a jump rope. Once you have one, you can hop, skip, and jump your way into an easy, natural, heart-strengthening exercise. Convenient? Inexpensive? Fun? You bet! And while you're improving your health, you're probably getting better at sports, too.","p2":"","gl":"","q":"The main idea of the paragraph is that","c":["jumping rope is a very good exercise.","jumping rope is a completely safe form of exercise.","jumping rope is one way to improve at the ballet.","jumping rope can be done with any type of rope."]},{"no":4,"p1":"Dear Jared,\n\nThanks for taking care of Charlie for me. He seems very happy. He can't stop wagging his tail. I'm happy to be home.\n\nYour friend,\n\nMia","p2":"","gl":"","q":"Which sentence from the letter tells the reader that Mia is writing about a pet?","c":["\"Thanks for taking care of Charlie for me.\"","\"He seems very happy.\"","\"He can't stop wagging his tail.\"","\"I'm happy to be home"]},{"no":5,"p1":"Book Club\n\nLiam's teacher announced a new book club in class. She shared information about the club. They would meet after school. They would read and discuss books. Liam plans to go. He wants to talk about books with other readers.","p2":"","gl":"","q":"What does the word announced mean in the story?","c":["told about","read about","cared about","thought about"]},{"no":6,"p1":"NICKI'S SHOES\n\nNicki found her old shoes. \"Mom,\" she called, \"I found my old high tops under the bed. I want to wear them to school\". \"Those old things?\" said her mother. \"Do they still fit?\"\n\nNicki looked at the shoes. They were dirty with old mud and pen marks. She and Rasha wrote all over them last year. Both shoes had big holes near the toe. The shoelaces were broken. Nicki smiled. She loved her high tops.\n\n\"Sure they fit!\" said Nicki. She pushed one foot into its shoe. Ouch! That was tight! She tried to put on the other shoe. She made the shoelace very loose, but her foot was stuck. Her heel would not go in.\n\n\"Mom.\" she wailed. \"Something is wrong!\"","p2":"","gl":"","q":"Why did Nicki say \"Sure they fit!\"?","c":["She wanted them to fit.","She tried them on and they fit.","She liked wearing tight shoes.","She could see they were the right size."]},{"no":7,"p1":"Mom bought a new blue chair. A truck brought the chair to our house. Two big men carried it in and put it down. \"Oh, no!\" she said. \"There is a red stain on the chair!\"","p2":"","gl":"scrape cut\n\nspeck tiny dot\n\nstain dirt that will not come out\n\nstripe along, thin line","q":"What is wrong with the chair?","c":["Someone got it dirty.","Someone cut part of it.","It has dots of dust on it.","It is blue with red lines."]},{"no":8,"p1":"Ann walked out of the cabin. She moved close to the family's wagon. A huge gust of wind blew. Her bonnet flew right off. It got stuck in the fence. Everyone looked and laughed.","p2":"","gl":"bonnet - a girl's hat\n\ncabin - a house made out of wood gust - sudden, strong wind","q":"Where does a girl wear a bonnet?","c":["on her legs","on her feet","on her head","on her hands"]},{"no":9,"p1":"You need plenty of snow to make a snowman. And you need the right kind of snow. It must be wet enough to stick together. Make a ball of snow and roll it in the snow so it gets bigger and bigger. Roll a second snowball that is a little smaller and put it on top of the big ball. This is the snowman's middle. You can use rocks to make the eyes, nose, and mouth. Branches make good arms. Add a hat if you like!","p2":"","gl":"","q":"Why did Susan write the passage?","c":["to tell about fun things to do with snow","to tell about different kinds of snow","to tell what a snowman looks like","to tell how to make a snowman"]},{"no":10,"p1":"Rick chewed his raw carrots loudly. then an apple. Terri sat next to him, trying not to listen. \"Are you about done?\" she growled, finally.","p2":"","gl":"","q":"What is Terri reacting to?","c":["things Rick said to her","the sounds of Rick eating","something the teacher said","something happening outside"]},{"no":11,"p1":"The doorbell rang. Mom shouted from downstairs, \"Aunt Sully is here!\" My sister Ava is usually full of pep and likes to move fast. But this time, she was a turtle. It took her three long minutes to make it downstairs. When she finally stood on the bottom step, Ava mumbled, \"Oh, hello. You must be our Aunt Sully.\"","p2":"","gl":"","q":"What does \"she was a turtle\" mean in the passage?","c":["she was quiet","she looked sleepy","she moved slowly","she wanted to hide"]},{"no":12,"p1":"My younger brother Terrance is only three years old. At home, he is very friendly and happy. He talks and laughs all the time. He even performs songs and dances for us. But when we meet new people, Terrance acts like a different boy. He turns his head away and refuses to look at the stranger. He grabs onto my mom, dad, or me and hides his face against us. Terrance suddenly becomes extremely quiet and will not speak at all.","p2":"","gl":"","q":"How does Terrance feel when meeting new people?","c":["shy","mad","calm","friendly"]},{"no":13,"p1":"Sammi was making a bouquet (boo kay) for her aunt's birthday. She picked some yellow daffodils, red tulips, and white daisies from her yard. Sammi put them into a jar of water. Then she tied a ribbon around the jar.","p2":"","gl":"","q":"Based on this, which is a bouquet made of?","c":["flowers","colored paper","birthday sards","jars with ribbons"]},{"no":14,"p1":"Pets\n\nPets are animals that live in a person's home. Many animals make good pets. Cats are small and quiet. Dogs like to play. Fish do not need much room. Birds can be taught how to say words. The best pet is the one that you like the most.","p2":"","gl":"","q":"What is the main purpose of this passage?","c":["to explain that most pets live with people","to explain that most pets are cats and dogs","to explain that there are many kinds of pets","to explain that many pets are better than one pet"]},{"no":15,"p1":"One day, a lion caught a mouse. The mouse said, \"Let me go, and one day I will help you.\" The lion agreed. Later on, the lion got caught in a trap. The mouse came along and chewed through the ropes, and the lion got away.\n\n(A retelling of \"The Lion and the Mouse\" from Aesop's Fables)","p2":"A big elephant often stepped on a mouse family's home as he walked to the river. The mice asked the elephant to take a different path. The elephant said yes. One day, the elephant got caught in a net. The mice chewed through the net and set the elephant free.\n\n(A retelling of \"The Little Mice and the Big Elephant\" from the Panchatantra)","gl":"","q":"What is the message of both Story 1 and Story 2?","c":["Being strong is better than being weak.","Being mean can make you feel unhappy.","Being nice to someone now will help you later.","Being mad at someone can lead to trouble later."]},{"no":16,"p1":"It was the night of the school play. Paul was on the side of the stage, and he could not stop moving. He had so much energy. He had practiced all summer for this one day, and he knew he was ready. Paul's mom came up behind him. \"Good luck, Paul. I know you're going to be great,\" she said as she gave him a big hug. He could not wait for his turn on stage. Then, he heard his name being called. He ran out as fast as he could and smiled at everyone who was looking at him.","p2":"","gl":"","q":"How does Paul feel in the passage?","c":["calm","excited","scared","worried"]},{"no":17,"p1":"Sarah's father gave Her a puppy for her birthday. The puppy's name was Sammy. When Sarah threw a ball high into the air, Sammy would jump up and try to catch it in his mouth. When Sarah rode her bike, Sammy would run along behind her. When she picked the puppy up and held him in her arms, he would lick her face. Sammy's favorite game was tag.","p2":"","gl":"","q":"Which word best tells what kind of puppy Sammy was?","c":["playful","soft","silly","smart"]},{"no":18,"p1":"We saw the two hikers ahead of us stumble just as they were about to cross the bridge. Dad and I decided to halt. One of the hikers turned around and called out to us, \"Be careful not to trip. The trail is really rocky and uneven!\\ We thanked her. Then Dad said that we might as well pause for a snack before getting back on the trail.","p2":"","gl":"","q":"Which underlined word in the passage means about the same as stumble?","c":["cross","halt","trip","pause"]},{"no":19,"p1":"Stacy connected the wire to the board and pulled the lever. Nothing happened. She examined each connection, tightening a bolt here, loosening one there. Then, she flipped the switch again. Nothing happened. The science fair was tomorrow. Stacy thought about Jason, whose invention would definitely impress the judges. She thought about Rachel, who had bragged she had the winning idea. Soon, she returned her attention to the board and disconnected each wire. She studied her drawings. At last she thought she had the solution. She began reconnecting the wires. Finally, she took a deep breath and pulled the lever. The bell rang, a door opened, and a cup carried a perfect portion of fish food to the fish bowl. A plastic arm tipped the cup of fish food and poured it into the bowl. Stacy cheered. It had taken weeks to complete, but finally the automatic fish feeder was working.","p2":"","gl":"","q":"Which is the main theme of the passage?","c":["If at first you don't succeed, try and try again.","Never put off until tomorrow what you can do today.","Many hands make even the heaviest load seem lighter.","There is no such thing as a new idea."]},{"no":20,"p1":"Tara looked at Lisa's paper. If only she could draw horses like Lisa's--with good legs and bodies and tails. Mine are okay from the neck up, she thought, but the bodies are hopeless. She pulled out a new piece of paper and started again, outlining the head, filling in mane and eyes and nostrils, shading to show muscles. \"Oh,\" said Lisa, \"that's beautiful! How do you draw such good horses?\"","p2":"","gl":"","q":"Which line from the passage shows that Tara admires Lisa's talent?","c":["\"Tara looked at Lisa's paper.\"","\"If only she could draw horses like Lisa's-\"","\"Mine are okay from the neck up.\"","\"She pulled out a new piece of paper and started again,\""]},{"no":21,"p1":"Alane enjoyed her dance class more than any other in school. To participate in the class, she had to arrive one hour early every day. She also had to practice two hours after school four nights a week. This meant she had to do her homework after dinner on those nights. Alane practiced hard and looked forward to the dance class's first school performance.","p2":"","gl":"","q":"Which best describes Alane's attitude towards her dance class?","c":["Dance was the only class she liked.","She liked dance class but hated to practice.","She did not mind working hard for a class she enjoyed.","She felt her dance class interfered with her homework."]},{"no":22,"p1":"The Shelburne Museum is a great place for families to visit. Most museums have just one building, but this museum has 39! The museum includes houses, barns, a lighthouse, and even an old steamship. It has fun things to interest people of all ages. My mother liked looking at paintings from the 1800s. I enjoyed running through the gardens. My dad thought the old stagecoaches were cool. And my grandpa liked the wooden circus figures. This is the best museum I've ever seen!","p2":"","gl":"","q":"Which sentence from the passage best explains why the Shelburne Museum is good for families?","c":["The Shelburne Museum is a great place for families to visit.","It has fun things to interest people of all ages.","My dad thought the old stagecoaches were cool.","This is the best museum I've ever seen!"]},{"no":23,"p1":"Alligators always make their nests with care. First the mother alligator digs a shallow hole. Then she lays her eggs in the hole. Next she covers her nest with grass to hide her eggs. Finally she crawls away.","p2":"","gl":"","q":"What is the main idea of this paragraph?","c":["Mother alligators dig holes.","Mother alligators crawl.","Alligators make their nests carefully.","Alligators lay eggs in holes."]},{"no":24,"p1":"Drawing\n\nA lot of people like to draw. There are many tools you can draw with. You can draw with crayons. You can draw with pencils. You can draw with pens. Crayons, pencils, and pens come in different colors. It is fun to draw.","p2":"","gl":"","q":"What is the purpose of this passage?","c":["to tell why drawing is fun","to tell about drawing tools","to tell readers how to draw","to tell readers what to draw"]},{"no":25,"p1":"Kate was upset. She had forgotten about the cupcake sale at school, and she loved cupcakes. However, she did not have money with her, so she went to the office to call her mom.\n\n\"Hi, Mom. Can you bring me some money so I can buy a cupcake today?\" she asked.\n\n\"Honey, I don't have any cash. I'II run to the bank to take out some money on my lunch break. Be patient, and I'II be there in a while,\" said Kate's mom.\n\n\"Thanks, Mom. You're the best!\" Kate said smiling.","p2":"","gl":"","q":"What does Kate's mom mean when she says she will \"run to the bank\"?","c":["She will make a quick trip to the bank.","She will think about going to the bank.","She will wear tennis shoes to the bank.","She will race as fast as she can to the bank."]},{"no":26,"p1":"Some people have pets. Some popular pets are dogs, cats, fish, birds, and reptiles. If you want to have a pet, it is important to choose the pet that is best for you. Some pets live indoors. Others stay outside. You must feed your pet. You need to wash and entertain many kinds of pets, too. It can be a lot of work to own a pet. It can also be a lot of fun.","p2":"","gl":"entertain to do something fun\n\npopular liked by a lot of people\n\nreptiles cold-blooded animals that have backbones","q":"How can someone entertain a pet?","c":["feed it","name it","play with it","give it a bath"]},{"no":27,"p1":"Salmon are a kind of fish. They are born in streams. These streams turn into rivers, and the rivers flow into the ocean. The fish swim down the rivers to the ocean. The fish live in the ocean for most of their lives. Some fish swim very far from their homes. When these fish become adults, they swim back to the streams where they were born. This is a long, hard trip. When the salmon get back to the streams, they lay their eggs. Then the baby salmon are born, and the long trip begins again.","p2":"","gl":"","q":"Why do salmon swim from the ocean to the stream?","c":["to lay their eggs","to find a new home","to become adult fish","to go where they were born"]},{"no":28,"p1":"Glass is made mostly from sand. Other materials are mixed with the sand. Then, the sand mixture is heated until very hot and the materials melt. This molten glass can be made into clear window glass. Or, it can be made into drinking glasses. When the molten glass cools, it is ready to use.","p2":"","gl":"material - metals or minerals\n\nmixture - something that is blended\n\nmolten - melted","q":"Which sentence correctly uses the word molten?","c":["The molten window was covered in frost.","We played in the sand at the molten beach.","We found some old molten papers in the box.","The man poured the molten material into the mold."]},{"no":29,"p1":"Fezi the Fox had pretty brown fur that everyone loved. He made sure it was always clean and brushed.\n\nOne day, Fezi was going to the river to wash his fur. He came across some bears. They were looking for berries.\n\n\"Can you help us find some berries?\" they asked Fezi.\n\n\"I'm sorry. I can't help you,\" Fezi said to them. \"I have to wash my fur.\"\n\nThe bears were surprised. \"How can you care more about your fur than helping us?\"\n\nFezi did not have a good answer for that, so he stopped and helped the bears find some berries.","p2":"","gl":"","q":"What lesson does Fezi learn in this story?","c":["Friends always help each other.","Treat others as you want to be treated.","Helping others brings good things to you.","How you act is more important than how you look."]},{"no":30,"p1":"Many spiders live in webs. The spiders use their webs for different things. Sometimes spiders use their webs to hide. Other times, they use their webs to catch bugs. The spider will eat bugs caught in its web. Spiders also lay eggs in their webs. The web keeps the eggs safe.","p2":"Hunting spiders do not make webs to catch food. Instead, they watch for their food. There are different types of hunting spiders. Some hunting spiders dig holes and wait inside. Then, they jump out of the hole to catch bugs. Other spiders chase bugs and jump on them.","gl":"","q":"What is the main idea of Part 1 and Part 2?","c":["The main idea of Part 1 is that webs keep spiders' eggs safe. The main idea of Part 2 is that some spiders dig holes.","The main idea of Part 1 is that spiders use webs to catch bugs. The main idea of Part 2 is that spiders jump on bugs.","The main idea of Part 1 is that spiders hide in webs. The main idea of Part 2 is that there are different types of hunting spiders.","The main idea of Part 1 is that spiders use webs for many things. The main idea of Part 2 is that some spiders hunt for their food."]},{"no":31,"p1":"Theo's cousins were coming over. He was excited, but his dad was not. The house was a mess, and Theo's dad wanted it to look nice. Theo started to clean his room. His dad cleaned the kitchen and then moved to the living room. \"Come on, Theo. We will be in the living room most of the time, and it's not clean yet.\" he called. Theo kept working to make his room neat. He thought his cousins would spend most of their time there. Luckily, their guests were late. Theo finished his room and then helped his dad. The house looked great!","p2":"","gl":"","q":"How is Theo's point of view different from his dad's point of view? Choose two answers.","c":["Theo wants to clean for his cousins.","Theo is excited his cousins are coming to visit.","Theo thinks his cousins will spend time in his room.","Theo wants the whole house to look nice for his cousins."]},{"no":32,"p1":"Homework Mix-Up\n\n1 Santo got ready for bed. Everything seemed normal. First, he brushed his teeth and washed his face. Then, he put on his pajamas. Finally, he put his homework on the kitchen table like he always did. --- -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- 2 The next morning, Santo went to school. When he took out his homework, he was surprised. He had grabbed his mother's cooking recipes instead of his homework. 3 When Santo got home, he and his mother laughed and laughed about the mistake. 4 The next day at school, Santo's teacher asked to borrow one of the recipes--the recipe for apple pie!","p2":"","gl":"","q":"Why does the author leave out the part of the story when Santo picks up the recipes instead of his homework?","c":["to give the story a problem in paragraph 1","to give the story a surprise in paragraph 2","to give the story a fun mother in paragraph 3","to give the story a happy ending in paragraph 4"]},{"no":33,"p1":"Kam and his dog Tank were best friends. One of their favorite things to do was to play catch by the creek.\n\n\"Good boy!\" Kam said as Tank brought back the ball. Then Kam threw the ball hard. It went right into the creek! Tank could normally get it, but the creek was high and the water was flowing fast. The ball disappeared down the creek.\n\nKam and Tank started to head home, but then they heard a voice call out. They turned around and saw a girl and her black, fluffy dog. The dog had their ball! They all decided to play catch together.","p2":"","gl":"","q":"How does the last paragraph best help tell the story?","c":["It tells where Kam and Tank like to play.","It tells how Kam and Tank like to have fun.","It tells that Kam and Tank have to go home.","It tells why Kam and Tank could keep playing."]},{"no":34,"p1":"The red panda lives in the mountains of Asia. This animal spends most of its time in trees. It is about the size of a pet cat. The red panda has a long, fluffy tail. The animal is named for its reddish-brown fur.\n\nThe red panda is great at climbing. Its claws can hold onto a tree trunk. They can grab branches easily. The red panda's tail keeps the animal steady. The tail keeps it from falling. The tail also helps the red panda stay warm on cold nights.","p2":"","gl":"","q":"What helps the red panda climb trees so well? Choose two answers.","c":["Its claws can grab easily.","It is the size of a pet cat.","Its tail keeps it from falling.","It stays warm on cold nights."]},{"no":35,"p1":"Baby chickens need lots of care. Being cold can make them sick. The place where they live should be very warm. You can use a bright light that also gives off heat. Put the light right over their cage. The baby chickens can stand under it to stay nice and warm.","p2":"Make sure your baby chickens have enough food and clean water in their cage. Change the water two or three times a day. At first, the baby chickens may need help finding the water in their new home. Lead one chicken to the water. Then the others will find it. too.","gl":"","q":"What is the difference between the two paragraphs?","c":["Part 1 is about where chicks live, Part 2 is not.","Part 1 is about how chicks need warmth, Part 2 is not.","Part 1 is about how chicks need loving care, Part 2 is not.","Part 1 is about how baby chicks need food and water, Part 2 is not."]},{"no":36,"p1":"Megan and Tom were excited about getting a cat. Megan wanted a big, orange cat. Tom wanted a black kitten. At the animal shelter, however, they both fell in love with a gray-and-white kitten.\n\nMegan said, \"Let's call him Rain Cloud!\"\n\n\"That sounds silly.\" said Tom. \"How about Charlie?\"\n\nThe children could not agree on a name. Megan thought they should take their time choosing a name. Tom wanted to name the cat right away.\n\nBack at home, Grandma said the kitten looked like a little tiger.\n\n\"That's it\" cried Megan.\n\n\"His name is Tiger!\" Tom agreed.","p2":"","gl":"","q":"How is Tom's point of view different from Megan's point of view? Choose two ways.","c":["Tom hopes to get a black kitten.","Tom is in a hurry to name the kitten.","Tom feels happy about getting a cat.","Tom thinks the cat needs a silly name."]},{"no":37,"p1":"Owl was sitting in a tree when Eagle flew down next to him.\n\n\"Isn't this the best branch?\" said Owl.\n\n\"It's all right.\" said Eagle. \"It's not the best.\"\n\nThe two birds began to squawk. Eagle said the branch was a little small for both of them. Owl said there was plenty of room. Eagle said he liked a higher branch. Owl said he liked a lower branch. Back and forth. back and forth it went. Back and forth, back and forth until finally. Eagle got up to leave.\n\n\"Don't go!\" said Owl. \"Maybe both branches are good in different ways.\"\n\n\"Maybe so.\" said Eagle.","p2":"","gl":"","q":"The words Back and forth, back and forth are used more than once in the passage. What does using these words more than once help to show about Owl and Eagle?","c":["They talk for a long time.","They keep changing their minds.","They move from branch to branch.","They leave the tree and come back."]},{"no":38,"p1":"Frogs are small, fast animals. They have strong back legs and can jump very far. Frogs help people by eating pesky insects. Frogs catch these insects in an interesting way. They use their sticky tongues. When an insect is near a frog, the frog sticks out its tongue. The insect sticks to the frog's tongue, and the frog eats it.","p2":"","gl":"","q":"What is the purpose of this paragraph?","c":["to tell a story about frogs","to inform readers about frogs","to persuade readers to like frogs","to show why the author likes frogs"]},{"no":39,"p1":"Joe likes to work in the garden. One day, he saw that one of his plants looked unhealthy. Joe knew he needed to rescue the plant. He moved it to a sunnier spot in the garden. Then he gave the plant some water. The next day, the plant looked much better.","p2":"","gl":"","q":"Which word is closest in meaning to \"rescue\" as it is used in the passage?","c":["fix","kеер","move","save"]},{"no":40,"p1":"[이미지]","p2":"","gl":"","q":"How are great horned owls and robins alike?","c":["They both eat mice and rats.","They both have hooked beaks.","They both care for their young.","They both eat seeds and insects."]},{"no":41,"p1":"Sandra was sleepy. Her eyelids drooped as she stared at her computer screen. Waves of drowsiness washed over her. It was hard to remember what she was writing. Maybe she should take a nap and then write some more. She yawned and stretched. Almost done, she thought, almost done.","p2":"","gl":"","q":"Which word tells how Sandra feels?","c":["drowsy","angry","excited","nervous"]},{"no":42,"p1":"Maple syrup on pancakes is a tasty treat! Where does the syrup come from? It comes from sugar maple trees.\n\nTo make syrup, people wait for the end of the winter. First, they drill little holes in the trees. Then, they put little spouts in the holes. Last, they put buckets beneath the spouts. Sap from the trees slowly drips into these buckets.\n\nWhen the buckets are full of sap, the sap is boiled to remove the water from it. It takes a lot of sap to make a little bit of syrup. Thank you, sugar maple trees!","p2":"","gl":"","q":"Which word has the same meaning as the word beneath in the passage?","c":["above","around","down","under"]},{"no":43,"p1":"NICKI'S SHOES\n\nNicki found her old shoes. \"Mom,\" she called, \"I found my old high tops under the bed. I want to wear them to school\". \"Those old things?\" said her mother. \"Do they still fit?\"\n\nNicki looked at the shoes. They were dirty with old mud and pen marks. She and Rasha wrote all over them last year. Both shoes had big holes near the toe. The shoelaces were broken. Nicki smiled. She loved her high tops.\n\n\"Sure they fit!\" said Nicki. She pushed one foot into its shoe. Ouch! That was tight! She tried to put on the other shoe. She made the shoelace very loose, but her foot was stuck. Her heel would not go in.\n\n\"Mom.\" she wailed. \"Something is wrong!\"","p2":"","gl":"","q":"Which is Nicki's problem?","c":["She has no shoes to wear.","She wants to wear shoes that are too small.","She cannot find her shoelaces.","She is going to be late for school."]},{"no":44,"p1":"Our Family Store\n\nOur family owns a store. The store is below our apartment. My sister and I help after school, and sometimes we work on weekends. We clean the store and help people find what they need. Mom and Dad say they appreciate our help and are glad to have such good workers.","p2":"","gl":"","q":"What does the word appreciate mean in the story?","c":["watch over","learn about","need more of","are thankful for"]},{"no":45,"p1":"Many people think alligators and crocodiles are the same animal. Though they are similar, there are differences between the two.\n\n[이미지]","p2":"","gl":"","q":"Which statement is true of both alligators and crocodiles?","c":["They both eat fish.","They are both dark colored.","They both live in salty water.","They both have narrow snouts."]},{"no":46,"p1":"Jasmine knew she had to race home from school. Grandma would be arriving before dinner. Jasmine made a welcome poster on the door. Then, she drew flowers on a card and left It on the pillow where Grandma would sleep. When Grandma arrived, Jasmine with a big hug.","p2":"","gl":"","q":"How does Jasmine feel about Grandma's visit?","c":["tired","shy","hopeful","excited"]},{"no":47,"p1":"Dry your hands completely. Wipe your hands with a paper towel, and throw it away after you're done.","p2":"","gl":"wipe verb to clean with long, gentle touches; to take away using long, gentle touches","q":"Which word has the same meaning as wipe as it is used in the passage?","c":["mop","rub","spread","treat"]},{"no":48,"p1":"I just can't wait for summer vacation! Every day feels like a Saturday then. I love to ride my bike around the neighborhood, and there will be plenty of time for that! To cool off on a hot day, I will dash through the sprinklers in the yard and scream when I get wet. In the evenings, my friends and I will play games outside until it gets dark. Summer will be so great!","p2":"","gl":"","q":"Which best describes how the author feels about summer vacation?","c":["amused","excited","nervous","patient"]},{"no":49,"p1":"[이미지]","p2":"","gl":"","q":"Which do Mary and Ella have in common?","c":["both are the new girls at school","both have a lot of friends at school","both would rather act than play sports","both have a hard time talking to people"]},{"no":50,"p1":"Keisha is preparing to write an essay about alligators and crocodiles. She makes the Venn diagram shown.\n\n[이미지]","p2":"","gl":"","q":"Which statement is true for both crocodiles and alligators?","c":["They like salty water.","They are good swimmers.","Their bodies are a gray-green color.","Their upper jaws are wider than their lower jaws."]},{"no":51,"p1":"Your teacher has given you the assignment of making a brochure for an after-school program.","p2":"","gl":"","q":"Which item should be included in the brochure?","c":["names of students who participated last year","beginning and ending times of the program","activities voted as favorite by last year's participants","your personal opinion of the leaders of the program"]},{"no":52,"p1":"The human body is made up of 206 bones. Bones are very important to the body. Bones keep some parts of the body safe. For example, the rib bones keep the heart and lungs safe. Bones help give the body its shape and work with muscles to help the body move.","p2":"","gl":"","q":"What is the main idea of this passage?","c":["The body has 206 bones.","Bones are very important.","Bones help give the body its shape.","Rib bones keep the heart and lungs safe."]},{"no":53,"p1":"Luke's neighbor, Mrs. Shay, lives alone and writes books for children. Sometimes Mrs. Shay tells Luke about a story idea. She asks him what he thinks. If he likes the idea, she starts writing the story. Sometimes Luke asks Mrs. Shay for a favor. He asks her to listen while he practices reading out loud.","p2":"Every day. Luke brings Mrs. Shay her mail. Every week, he waters the flowers in Mrs. Shay's three big flowerpots. One day, Luke needs to write a story for homework. He thinks and thinks, but he does not know what to write about. He asks Mrs. Shay. She says, Write about a nice boy who does chores for his neighbor.\"","gl":"","q":"What do Luke and Mrs. Shay do in both passages?","c":["They care for plants","They open their mail.","They help each other.","They practice reading."]},{"no":54,"p1":"Music Class\n\n\"I get to pick my instrument tomorrow.\" Zach told his sister, \"and I'm going to play trumpet.\"\n\n\"Trumpet?\" said Nora. \"You should play drums.\"\n\n\"But I like trumpet\" said Zach.\n\n\"I'm telling you, drums are better.\" said Nora.\n\nThe next day. Zach told his teacher he had decided on drums.\n\n\"I thought you wanted trumpet.\" said Ms. Asher.\n\n\"So did I.\" he said sadly.\n\nZach began to practice with the drumsticks, but his eyes kept wandering to the trumpets, which looked like so much fun.\n\nMs. Asher brought a trumpet to Zach and said, \"Here, why don't you try this.\"\n\n\"Really?\" said Zach.\n\n\"It's what you want, right?\" said Ms. Asher.\n\nZach reached out and took the trumpet into his hands.\n\nanswer Part B.","p2":"","gl":"","q":"Why does Zach choose drums in the passage?","c":["His teacher asks him to try drums.","His sister thinks drums are better.","He practices drums and likes them.","He gets to use drumsticks on drums."]},{"no":55,"p1":"Music Class\n\n\"I get to pick my instrument tomorrow.\" Zach told his sister, \"and I'm going to play trumpet.\"\n\n\"Trumpet?\" said Nora. \"You should play drums.\"\n\n\"But I like trumpet\" said Zach.\n\n\"I'm telling you, drums are better.\" said Nora.\n\nThe next day. Zach told his teacher he had decided on drums.\n\n\"I thought you wanted trumpet.\" said Ms. Asher.\n\n\"So did I.\" he said sadly.\n\nZach began to practice with the drumsticks, but his eyes kept wandering to the trumpets, which looked like so much fun.\n\nMs. Asher brought a trumpet to Zach and said, \"Here, why don't you try this.\"\n\n\"Really?\" said Zach.\n\n\"It's what you want, right?\" said Ms. Asher.\n\nZach reached out and took the trumpet into his hands.\n\nanswer Part B.","p2":"","gl":"","q":"What does Zach realize while he is drumming?","c":["He no longer likes music class.","He still wants to play trumpet.","He wants to talk with his sister.","He needs more time to practice."]},{"no":56,"p1":"New Kid at School\n\nNolan is carrying his lunch to his usual table where his friends are already sitting, laughing together. Then he sees Zara by herself.\n\nNolan remembers what it was like to be the new kid. He walks to\n\nZara's table.\n\n\"Hey, Zara,\" he says.\n\nZara looks up from her book in surprise. \"Uh, hi.\"\n\n\"That's a good book.\" Nolan says. \"Adams is my favorite\n\nauthor.\"\n\nZara looks surprised. \"Really?\" she says. \"Few people know\n\nabout her.\"\n\n\"My friends and I think she's great. Want to come meet them?\"\n\nZara gets up, gathers her things, and nervously follows Nolan.\n\n\"Hey, everyone.\" Nolan says, \"this is Zara, and she's an Adams fan!\"\n\nThe group cheers and makes room for Nolan and Zara.","p2":"","gl":"","q":"Which statement best describes Nolan in the passage?","c":["He is kind.","He is quiet.","He is funny.","He is proud."]},{"no":57,"p1":"New Kid at School\n\nNolan is carrying his lunch to his usual table where his friends are already sitting, laughing together. Then he sees Zara by herself.\n\nNolan remembers what it was like to be the new kid. He walks to\n\nZara's table.\n\n\"Hey, Zara,\" he says.\n\nZara looks up from her book in surprise. \"Uh, hi.\"\n\n\"That's a good book.\" Nolan says. \"Adams is my favorite\n\nauthor.\"\n\nZara looks surprised. \"Really?\" she says. \"Few people know\n\nabout her.\"\n\n\"My friends and I think she's great. Want to come meet them?\"\n\nZara gets up, gathers her things, and nervously follows Nolan.\n\n\"Hey, everyone.\" Nolan says, \"this is Zara, and she's an Adams fan!\"\n\nThe group cheers and makes room for Nolan and Zara.","p2":"","gl":"","q":"What happens because of the correct answer from Part A?","c":["Nolan sits at a new table.","Nolan learns about a new author.","Nolan no longer feels like the new kid.","Nolan makes friends with someone new."]},{"no":58,"p1":"Tessa is nervous. Tonight she will play the plano in her first recital. She has been practicing for weeks. All of her family is going to see it. Her mother bought her a new shirt to wear. Tessa's teacher showed her a special way to breathe that will help her relax before she goes out. Tessa will be sure to breathe in the special way tonight.","p2":"","gl":"attend to go to an event\n\nrecital a show where somebody plays music or dances\n\nrelax to become calm","q":"What does \"recital\" mean?","c":["a way to calm down","a piece of piano music","a music or dance event","a special way to breathe"]},{"no":59,"p1":"The plans were set in motion. Judith would pick up the cake. Talia would make sure everyone was at the restaurant on time. The girls were so excited! Their parents had no idea that they were throwing them a surprise party.\n\nmotion: action, pace, signal, suggestion","p2":"","gl":"","q":"Which is closest in meaning to \"motion\" as used in the passage?","c":["action","pace","signal","suggestion"]},{"no":60,"p1":"Many people have either a dog or a cat as a pet. Some people love dogs, but other people like cats. Dogs are known as \"man's best friend and many dogs are eager to please. But dogs can be wild and noisy, and they need a lot of care. You have to walk dogs outside twice a day. Cats are much easier to care for. They do not need much space. Plus, cats are sweet and playful. A cat is warm and soft when it sits on your lap and starts purring. Unlike a dog, a cat could never jump up and knock you over.","p2":"","gl":"","q":"What does the writer believe about dogs and cats?","c":["Cats are more fun than dogs.","Cats are better pets than dogs.","Dogs and cats are a lot of work.","Dogs are more popular than cats."]},{"no":61,"p1":"John was all ready to play in the big soccer game but couldn't find his soccer shoes. He knew he wouldn't play well without then. He searched his room, the playroom, and beside the back door where he sometimes took off his shoes. He asked his sister if she would help him look. She found them in the bathroom next to the clothes hamper. John was glad to have his shoes for the big game.","p2":"","gl":"","q":"How did John solve the problem of his lost soccer shoes?","c":["He called his friend to borrow some.","He asked his sister to help him look.","He asked his parents to buy him new ones.","He decided to use his tennis shoes."]},{"no":62,"p1":"Slowly, slowly, Tayshon walked into his new school. He found room 102 at the end of the hall. He did not hear any sounds inside. Slowly, slowly, Tayshon opened the door. In silence, twenty faces turned to look at him. Their math books sat on the desks. Every book was open to the same page. One student dropped his book on the floor. Slam! It landed with a loud noise. Another girl was raising her hand. Instead, she put it down and she stared at Tayshon. It was a friendly stare. He stepped into the room.","p2":"","gl":"","q":"Based on the details in the story, where does this story take place?","c":["a public library","a school bus","a math class","a school auditorium"]},{"no":63,"p1":"Steven was excited when Grandpa arrived. He gave Grandpa a big hug.\n\n\"We don't have a lot of time, but I would like to take a nice, brisk walk around the field before your dad calls us in for dinner.\" said Grandpa. \"Would you like to join me?\"\n\n\"Yes!\" Steven cried.","p2":"","gl":"brisk adj. busy, quick, ready, sharp","q":"Which word would best replace \"brisk\" in the story?","c":["busy","quick","ready","sharp"]},{"no":64,"p1":"Physical Education in School\n\nMost people say that classes like English, math, and science should take up most of the school day. These classes help get students ready for high school, college, and careers.\n\nWe shouldn't forget that physical education is also important. Some people think that PE isn't important. However, most health experts say that everyone should get 30 minutes of exercise a day to be healthy. Some exercises, like running, are good for the heart and lungs. Others, like lifting weights, help build strong bones. Studies have shown that exercise is very important for kids. Being active helps young bodies and minds grow.\n\nOur schools should have one hour of PE every day. Students can use this time to clear their minds and be ready to learn in their other classes. Exercise can help them feel better and be happier. Teachers are sure to like that!","p2":"","gl":"","q":"Which sentence from the passage best explains why exercise is important for children?","c":["\"These classes help get students ready for high school, college, and careers.\" (Paragraph 1)","\"Being active helps young bodies and minds grow.\" (Paragraph 2)","\"Our schools should have one hour of PE every day.\" (Paragraph 3)","\"Teachers are sure to like that'\" (Paragraph 3)"]},{"no":65,"p1":"Beagles\n\nThe beagle is a wonderful pet. It is a medium-sized dog that is sweet and gentle. Like other members of the hound family, beagles are energetic dogs. They thrive on daily walks and play time. Beagles are smart dogs, but they can sometimes be stubborn. Firm and friendly training important for every beagle. Given the proper care, beagles are loyal and loving companions.","p2":"","gl":"","q":"Which detail best supports the main idea that beagles are good pets?","c":["Beagles need training.","Beagles like to go on walks.","Beagles are playful and friendly.","Beagles belong to the hound family."]},{"no":66,"p1":"Secret Note\n\nEmmet paced the floor, wondering why his sister had to be so difficult. Thanks to her, he was stuck in his room. He heard something slip under his door and turned to find a piece of paper. Written on it was the statement \"Guess a letter,\" followed by eight blank lines. Emmet crumpled the paper into a ball.\n\nEmmet could not pass up a challenge, though, and minutes later he was smoothing out the paper. He wrote down the letter \"S\" and slipped the paper back under the door. He had hardly stepped away when the paper reappeared. One of the blank lines now had an \"S\" penciled in! Emmet wrote the letter \"E\" next and slid the paper back, but it returned almost immediately with no new\n\nblanks filled in.\n\nAfter several rounds of back-and-forth, Emmet was finally able to decode his sister's secret message: \"I am sorry.\"","p2":"","gl":"","q":"Why does Emmet crumple the paper in paragraph 1?","c":["He does not like writing","He is angry with his sister.","He does not want to clean up.","He loses a game with his sister."]},{"no":67,"p1":"Marnie needed a new lacket. Her old jacket was too small. Marnie went to the store with her dad. She tried on several jackets, but nothing fit quite right. Marnie saw a purple jacket with a butterfly on it. As she pulled it off the hanger, she hoped it would fit. With a big smile on her face, Marnie turned around to her dad. The jacket fit like a glove. Marnie was so excited to find a new jacket that she loved.","p2":"","gl":"","q":"What is the meaning of the sentence, \"The jacket fit like a glove\"?","c":["The jacket is the one Marnie loves most.","The jacket is exactly the right size for Marnie.","The jacket matches the color of Marnie's gloves.","The jacket fits Marnie in the same way as her old jacket."]},{"no":68,"p1":"Paul finally finished his poster for his school project. He put it by the door so he would find it the next morning. On his way out the door the next day, Paul reached for his poster, but it was gone! Paul looked around and couldn't find his poster.","p2":"","gl":"","q":"What is the conflict in this story?","c":["He found his poster.","Paul lost his poster.","Paul put his poster by the door.","Paul took his poster to school."]},{"no":69,"p1":"\"You're going to love tonight's dinner.\" sald Dad, placing a steaming dish on the dining room table. \"I'm calling It 'Everyone's Favorite Soup.\"\n\n\"I'm sure it's delicious.\" said Mother brightly. But Matt wasn't so sure. He loved his dad, but when It was Dad's night to cook. you never knew what you'd get. After his first bite, Matt knew that \"Everyone's Favorite Soup\" was not his favorite soup.\n\n\"Oh. I forgot the salad.\" said Dad.\n\n\"I'Il help.\" sald Mother, following him to the kitchen. Matt saw his chance and took It.\n\n\"Here. Dusty,\" he whispered, motioning to his dog.","p2":"","gl":"","q":"Why does Matt call his dog?","c":["He wants to give his dog a hug.","He wants to take his doglfor a walk.","He wants to give his dinner to the dog.","He wants his dog to go into the kitchen."]},{"no":70,"p1":"I walk to school with my dad every morning. Rosa rides to school In her mother's car. James comes on the bus. Unda and Steve ride with Steve's father.","p2":"","gl":"","q":"Which is the best summary?","c":["Some students ride to school in a car.","Getting to school on a bus is easy.","Walking to school is healthy.","There are many ways to get to school."]},{"no":71,"p1":"Manny looked all over the house for his library book. It was due today and he couldn't find it anywhere.\n\n\"Mom, have you seen my library book. the one with the red cover?\"\n\n\"You mean this one?\" Mom said as she pulled it out of his backpack.\n\nManny's eyes popped. Yes, that's the one! I can't believe I didn't look in my own backpack!\"","p2":"","gl":"","q":"What is the most likely meaning of \"Manny's eyes popped\" as it is used in the passage?","c":["Manny was surprised.","Manny was tired of looking.","Manny recognized the book.","Manny felt very uncomfortable."]},{"no":72,"p1":"Joseph woke up. He remembered that it was Saturday! Quick as a wink, he hopped out of bed and threw on his clothes. He ran downstairs to eat breakfast. Then he hurried outside and rode his bike to the park. Joseph loved Saturdays!","p2":"","gl":"","q":"What does \"quick as a wink\" mean in the story?","c":["Joseph got ready fast.","Joseph closed one eye.","Joseph opened his eyes.","Joseph slept some more."]},{"no":73,"p1":"Sally and her mom walked slowly home from school. They talked about Sally's new teacher and looked over her homework. When they got to their apartment, Sally's mom told her dinner would be ready in about an hour.\n\n\"Would you like some refreshments while you do your homework?\" she asked.\n\n\"Yes, please, Mom!\" Sally said, getting her books out of her backpack.\n\nrefreshment (re • fresh • ment)\n\nverb 1) becoming stronger or more alert\n\nnoun 2) food or drink 3) a refill of something","p2":"","gl":"","q":"Which did Sally's mother most likely give her?","c":["nuts and a glass of juice","pencils and paper","a pillow and blanket","another book to read"]},{"no":74,"p1":"Parrots\n\nParrots are birds. Some are very large. Others are small. Most parrots are very brightly colored. Some parrots have feathers in every color of the rainbow.\n\nParrots are found in rain forests around the world. They like to live in large groups. Many parrots are good at copying sounds.\n\nSome people keep parrots as pets. People enjoy parrots because of their beautiful colors. Parrots are smart and fun to watch, too. Parrots often learn to say the words and phrases their owners teach them to say.\n\nParrots can be great pets, but they take a lot of work. They can live a long time. And they need a lot of attention.","p2":"","gl":"","q":"How does being with people affect parrots?","c":["The parrots become large.","The parrots live longer lives.","The parrots often learn to talk.","The parrots miss being with birds."]},{"no":75,"p1":"Everyone should own a dog. Dogs, even sma ["He wants to give his dog a hug.","He wants to take his dog for a walk.","He wants to give his dinner to the dog.","He wants his dog to go into the kitchen."]},{"no":98,"p1":"Jordan looked down as his sister and the rest of the team sprinted onto the basketball court. The fans erupted Into thunderous cheers, but\n\nJordan's heart was pounding so hard he couldn't make a sound. Suddenly his dad gave him a punch on the shoulder and pointed at the giant TV screen in one corner of the auditorium. Jordan's face, painted the school colors of blue and white, was filling the screen! Jordan's first reaction was to duck out of sight, but then he remembered his sign and started waving it wildly. It sald, \"Skyler Jameson - Big East Player of the Year!!\" \"Skyler! Skyler!\" roared the fans. Skyler looked up and saw the Image of her little brother half-hidden behind his giant homemade sign. She scanned the crowded stands until she found him. She stood very still and gave him a special smile. Then she turned back to her teammates,","p2":"","gl":"","q":"Based on the passage, which is the most likely reason Jordan is silent?","c":["He is trying to hear what his sister is saying.","His father is talking to him.","He wants to hear the announcer.","He is nervous and excited."]},{"no":99,"p1":"Elephants live in Africa and Asia. The African elephant Is the biggest land animal in the world, It has very large ears. African elephants have two finger-like parts at the end of their trunks. These parts help the elephant grab things, like grass and sticks. The Aslan elephant is a little smaller than the African elephant. Its ears are smaller and rounder. It only has one finger-like part on its trunk.","p2":"","gl":"","q":"What is the main structure of the passage?","c":["order of events","cause and effect","problem and solution","compare and contrast"]},{"no":100,"p1":"Luna\n\nI finally got to adopt a puppy from the shelter! Her name is Luna, and she's brown and white with velvety soft ears. o pieces","to force through something"]},{"no":103,"p1":"One summer day, a fox saw a delicious-looking bunch of grapes on a vine hanging from a high tree branch. \"Those juicy grapes are exactly what I need on this hot day.\" the fox sald. The fox jumped into the air to get the grapes but was unable to reach them. He tried again and again, but the grapes were simply too high. Finally, the fox gave up and walked away, saying, \"I'll bet those grapes are sour anyway.\"","p2":"Alexandra saw a kitten at the animal shelter and begged her father to buy it. Alexandra's father apologized and explained that they already had a cat, and one pet was more than enough. Alexandra persisted and kept asking, and her father kept firmly saying no. Finally, Alexandra gave up and walked away, saying, \"Having a kitten probably wouldn't be much fun anyway.","gl":"","q":"How are the fox in Passage 1 and Alexandra in Passage 2 alike?","c":["When they see something they like, they work hard until they get it.","When they want something nice. they are happy when they finally have it.","When they do not like anything they see, they look for something better.","When they cannot have something they want, they decide it is not any good."]},{"no":104,"p1":"Elevators\n\nElevators are booths or platforms that move people and goods up and down. Many people think elevators are a modern invention, but\n\nmachines that lift and lower Arst appeared thousands of years ago.\n\nThe first elevators were operated by ropes and powered by people. Some were so large it took thousands of people to run them! The first modern elevator was built in New York City in 1857. It was powered by a steam engine and was very slow. People refused to use it. At the time, bulldings were only a few stories tall, so elevators were not really needed.\n\nElevators became common in the 1880s when skyscrapers were built. No one wanted to dimb all those stairs. Today, elevators are in\n\nmost buildings over a few stories tall. The elevators are electric and very fast.","p2":"","gl":"","q":"Based on the passage, choose two main ways today's elevators differ from the first elevators.","c":["Today's elevators are faster.","Today's elevators are bigger.","Today's elevators are easier to build.","Today's elevators are powered by electricity. / Today's elevators are for people instead of goods."]},{"no":105,"p1":"Scallops and clams are both mollusks. A mollusk is a sea creature that has a hard shell but a soft body. Scallops and clams both feed by\n\npulling water into their shells and sifting out tiny plants and animals. This food that floats by in the ocean is called plankton. The scallop lives on the ocean floor in shallow water. A clam makes its home by burrowing deep into sand or mud.","p2":"","gl":"","q":"How are scallops and clams different?","c":["They eat different kinds of food.","They have different types of bodies.","They have different ways of feeding.","They make their homes in different places."]},{"no":106,"p1":"Slowly, slowly, Tayshon walked into his new school. He found room 102 at the end of the hall. He did not hear any sounds inside. Slowly, slowly, Tayshon opened the door. In silence, twenty faces turned to look at him. Their math books sat on the desks. Every book was open to the same page. One student dropped his book on the floor. Slam! It landed with a loud noise. Another girl was raising her hand. Instead, she put it down and she stared at Tayshon. It was a friendly stare. He stepped into the room.","p2":"","gl":"","q":"Based on the details in the story, where does this story take place?","c":["a public library","a school bus","a math class","a school auditorium"]},{"no":107,"p1":"Ambrose stared at the row of locked boxes on the table. \"One of them must have the key to the secret room.\" he thought. The first box was made of wood and had a picture of a horse on it. The second one was made of a silvery metal. Carvings of turtles covered the lid of the next wooden box. Finally, Ambrose looked at the last box. A picture of a door was carved into its wooden top. \"This must be it,\" he thought.","p2":"","gl":"","q":"Why does Ambrose think the last box holds the key?","c":["It is a wooden box.","It is silver in color.","It has a lock on the front.","It has a picture of a door on top."]},{"no":108,"p1":"Asha's class is studying the state of Maine. They learn that the state is known for its blueberrles. In the summer, small famlly farms sell the berries.\n\nThis graph shows one family's blueberry crop. The graph shows how many pints of berries the family harvested and sold between 2005 and 2010.\n\n[이미지]","p2":"","gl":"","q":"In which year did the family sell the LEAST amount of blueberries?","c":["2005","2007","2008","2009"]},{"no":109,"p1":"[이미지]","p2":"","gl":"","q":"Based on the Venn diagram, which is one way apes and monkeys are alike?","c":["Both have talls.","Both are mammals.","Both are very large.","Both are great climbers."]},{"no":110,"p1":"Neena aimed carefully. She stood as still as she could. Then, she let go of the string with her fingers and watched to see If she hit what she was aiming for.\n\n[이미지]","p2":"","gl":"","q":"Based on the glossary, which sport is Neena playing?","c":["archery","billiards","javelin","pole vault"]},{"no":111,"p1":"Mount Rushmore is a famous sculpture. It Is in South Dakota. Mount Rushmore is a mountain with four people's faces carved in It. The people carved into Mount Rushmore were all presidents of the United States. They are Presidents George Washington, Thomas Jefferson, Abraham Lincoln, and Theodore Roosevelt. The faces are over 60 feet high. The sculpture took 14 years to carve. Between two and three million people visit Mount Rushmore every year.","p2":"","gl":"","q":"What is another example of a sculpture?","c":["a hill","a painting","a photograph","a statue"]},{"no":112,"p1":"For many years, our school has split up lunch periods by grade level. I think students of all grades should eat lu const STORAGE_KEY = 'map_rc_g24_answers_v1';

// ----- state -----
let selectedSize = 20;
let session = []; // current sampled questions
let userAnswers = {}; // qno -> selected (1..4)

function loadAnswerKey() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveAnswerKey(obj) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
}

function refreshAnswerStatus() {
  const k = loadAnswerKey();
  const n = Object.keys(k).filter(x => k[x]).length;
  document.getElementById('answer-status').textContent = `로컬 저장된 정답: ${n} / ${QUESTIONS.length}`;
}

function showScreen(id) {
  ['start-screen','test-screen','admin-screen'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
  window.scrollTo({top:0, behavior:'instant'});
}

// ----- size buttons -----
document.querySelectorAll('.size-btn').forEach(b => {
  b.addEventListener('click', () => {
    selectedSize = parseInt(b.dataset.size, 10);
    document.querySelectorAll('.size-btn').forEach(x => {
      x.classList.remove('bg-slate-900','text-white','border-slate-900');
      x.classList.add('border-slate-300');
    });
    b.classList.add('bg-slate-900','text-white','border-slate-900');
    b.classList.remove('border-slate-300');
  });
});

// ----- start test -----
document.getElementById('start-btn').addEventListener('click', () => {
  const n = Math.min(selectedSize, QUESTIONS.length);
  // Fisher-Yates shuffle copy
  const arr = QUESTIONS.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  session = arr.slice(0, n).sort((a,b)=>a.no-b.no);
  userAnswers = {};
  renderTest();
  showScreen('test-screen');
});

// ----- render test -----
function escapeHTML(s) {
  return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function passageHTML(text) {
  if (!text) return '';
  return escapeHTML(text).replace(/\[이미지\]/g,'<span class="img-marker">[이미지 — 원본 문서 참조]</span>');
}

function renderTest() {
  document.getElementById('total-count').textContent = session.length;
  document.getElementById('answered-count').textContent = '0';
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('result-banner').classList.add('hidden');

  const wrap = document.getElementById('questions');
  wrap.innerHTML = '';

  session.forEach((q, idx) => {
    const card = document.createElement('article');
    card.className = 'bg-white rounded-xl border border-slate-200 shadow-sm p-5';
    card.id = 'q-' + q.no;

    let html = '';
    html += `<header class="flex items-center justify-between mb-3">
      <div class="text-xs font-semibold text-slate-500 tracking-wider">문항 ${idx + 1} / ${session.length} <span class="text-slate-300">·</span> 원본 No. ${q.no}</div>
      <div class="text-xs text-slate-400" id="status-${q.no}"></div>
    </header>`;

    if (q.p1) {
      html += `<div class="passage bg-slate-50 border border-slate-100 rounded-lg p-3 text-sm leading-relaxed text-slate-700 mb-2">${passageHTML(q.p1)}</div>`;
    }
    if (q.p2) {
      html += `<div class="passage bg-slate-50 border border-slate-100 rounded-lg p-3 text-sm leading-relaxed text-slate-700 mb-2"><div class="text-xs text-slate-400 font-medium mb-1">Passage 2</div>${passageHTML(q.p2)}</div>`;
    }
    if (q.gl) {
      html += `<details class="mb-3 border border-slate-200 rounded-lg p-2 bg-amber-50/50">
        <summary class="text-sm font-medium text-amber-900">📚 Glossary / 보조 자료</summary>
        <div class="passage mt-2 text-sm text-slate-700">${passageHTML(q.gl)}</div>
      </details>`;
    }

    html += `<div class="font-medium text-slate-900 mb-3">${escapeHTML(q.q)}</div>`;

    html += '<div class="space-y-2">';
    q.c.forEach((opt, i) => {
      if (!opt) return;
      const num = i + 1;
      html += `<label class="flex items-start gap-3 p-3 rounded-lg border border-slate-200 hover:border-slate-400 cursor-pointer transition" data-choice="${num}">
        <input type="radio" name="ans-${q.no}" value="${num}" class="mt-1">
        <div class="text-sm text-slate-800"><span class="font-semibold mr-1.5 text-slate-500">${num}.</span>${escapeHTML(opt)}</div>
      </label>`;
    });
    html += '</div>';

    card.innerHTML = html;
    wrap.appendChild(card);

    // Wire radio change
    card.querySelectorAll(`input[name="ans-${q.no}"]`).forEach(inp => {
      inp.addEventListener('change', e => {
        userAnswers[q.no] = parseInt(e.target.value, 10);
        updateProgress();
      });
    });
  });
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  document.getElementById('answered-count').textContent = answered;
  const pct = session.length ? (answered / session.length * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

// ----- submit -----
function submitTest() {
  const key = loadAnswerKey();
  let scored = 0, total = 0, missing_key = 0;

  session.forEach(q => {
    const raw = (key[String(q.no)] || '').trim();
    const card = document.getElementById('q-' + q.no);
    const status = document.getElementById('status-' + q.no);
    if (!raw) {
      missing_key++;
      if (status) status.innerHTML = '<span class="text-amber-600">정답 미등록</span>';
      return;
    }
    total++;
    const correctSet = new Set(raw.split(/[\s,]+/).map(x=>parseInt(x,10)).filter(Boolean));
    const userPick = userAnswers[q.no];
    const isCorrect = userPick && correctSet.has(userPick);
    if (isCorrect) scored++;

    // Mark choices
    card.querySelectorAll('label').forEach(lab => {
      const c = parseInt(lab.dataset.choice, 10);
      lab.classList.remove('marked-correct', 'marked-wrong');
      if (correctSet.has(c)) lab.classList.add('marked-correct');
      if (userPick === c && !correctSet.has(c)) lab.classList.add('marked-wrong');
    });
    if (status) {
      status.innerHTML = isCorrect
        ? '<span class="text-emerald-600 font-semibold">정답</span>'
        : '<span class="text-rose-600 font-semibold">오답</span> · 정답: ' + Array.from(correctSet).join(',');
    }
  });

  const banner = document.getElementById('result-banner');
  banner.classList.remove('hidden','bg-amber-50','border-amber-200','bg-emerald-50','border-emerald-200');
  if (total === 0) {
    banner.className = 'mt-4 p-4 rounded-xl border bg-amber-50 border-amber-200 text-amber-900';
    banner.innerHTML = `<strong>채점 불가</strong> · 출제된 ${session.length}문항 모두 정답이 등록되어 있지 않습니다. 시작 화면에서 <em>관리자 정답 입력</em>으로 정답을 등록한 뒤 다시 시도하세요.`;
  } else {
    const pct = ((scored / total) * 100).toFixed(1);
    banner.className = 'mt-4 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900';
    banner.innerHTML = `<strong>점수: ${scored} / ${total} (${pct}%)</strong>`
      + (missing_key > 0 ? ` <span class="text-amber-700">· 정답 미등록 ${missing_key}문항 채점에서 제외</span>` : '');
  }
  window.scrollTo({top: 0, behavior:'smooth'});
}
document.getElementById('submit-btn').addEventListener('click', submitTest);
document.getElementById('submit-btn-bottom').addEventListener('click', submitTest);
function reset() { showScreen('start-screen'); refreshAnswerStatus(); }
document.getElementById('reset-btn').addEventListener('click', reset);
document.getElementById('reset-btn-bottom').addEventListener('click', reset);

// ----- admin mode -----
function renderAdmin() {
  const list = document.getElementById('admin-list');
  const key = loadAnswerKey();
  list.innerHTML = '';
  QUESTIONS.forEach(q => {
    const cur = key[String(q.no)] || '';
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2 text-sm';
    row.innerHTML = `<span class="w-12 shrink-0 text-slate-500 font-mono text-right">${q.no}.</span>
      <span class="flex-1 truncate text-slate-700" title="${escapeHTML(q.q)}">${escapeHTML(q.q)}</span>
      <input type="text" inputmode="numeric" maxlength="5" data-no="${q.no}" value="${escapeHTML(cur)}" class="ans-input w-16 border border-slate-300 rounded-md px-2 py-1 text-sm text-center">`;
    list.appendChild(row);
  });
  list.querySelectorAll('.ans-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const k = loadAnswerKey();
      const v = e.target.value.trim();
      if (v) k[e.target.dataset.no] = v;
      else delete k[e.target.dataset.no];
      saveAnswerKey(k);
      refreshAnswerStatus();
    });
  });
}
document.getElementById('open-admin').addEventListener('click', () => {
  renderAdmin();
  showScreen('admin-screen');
});
document.getElementById('close-admin').addEventListener('click', () => {
  showScreen('start-screen');
  refreshAnswerStatus();
});
document.getElementById('bulk-apply').addEventListener('click', () => {
  const txt = document.getElementById('bulk-input').value.trim();
  if (!txt) return;
  const tokens = txt.split(/[,\s]+/).filter(Boolean);
  const k = loadAnswerKey();
  QUESTIONS.forEach((q, i) => {
    if (tokens[i]) k[String(q.no)] = tokens[i];
  });
  saveAnswerKey(k);
  renderAdmin();
  refreshAnswerStatus();
});
document.getElementById('clear-all').addEventListener('click', () => {
  if (!confirm('등록된 모든 정답을 삭제할까요?')) return;
  saveAnswerKey({});
  renderAdmin();
  refreshAnswerStatus();
});

refreshAnswerStatus();
</script>
</body>
</html>
