# ACM frontend — nginx config (runs inside acm-frontend container).
# - Serves the Vite SPA bundle from /usr/share/nginx/html.
# - History API fallback: any unknown path → index.html (React Router).
# - /api/* → upstream backend (configurable via Docker network alias).
#
# Set the backend upstream via build/runtime by templating ACM_API_UPSTREAM
# (defaulted to host.docker.internal:4009 for laptop dev).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Tighten defaults
    server_tokens off;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static assets — long cache, immutable hash filenames from Vite.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        root /usr/share/nginx/html;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Backend API — forwarded to NestJS. The Docker network alias `backend`
    # resolves inside docker-compose; for laptop dev where the backend runs
    # native on the host, override at compose time:
    #   extra_hosts: ["backend:host-gateway"]
    location /api/ {
        proxy_pass http://backend:4009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # SPA fallback — every other route renders index.html so React Router
    # can take over.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
