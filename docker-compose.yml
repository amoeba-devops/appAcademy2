services:
  redis:
    image: redis:7-alpine
    container_name: tac-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - tac-redis-data:/data

  postgres:
    build:
      context: ./docker/staging
      dockerfile: Dockerfile.postgres-acm
    image: tac-postgres-acm:pg16-bigm
    container_name: acm-postgres
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: acm
      POSTGRES_PASSWORD: acm
      POSTGRES_DB: db_acm
    volumes:
      - acm-pg-data:/var/lib/postgresql/data
      # REQ-261017 — 빈 볼륨 최초 기동 시 배포와 같은 순서(scripts/acm-migration-order.sh)로 적용
      - ./docker/local/initdb-acm.sh:/docker-entrypoint-initdb.d/10-acm.sh:ro
      - ./scripts:/acm-scripts:ro
      - ./sql/acm:/acm-sql:ro

  # ACM v1.0a frontend (Vite SPA → nginx). Production-style image; daily
  # dev still runs `npm run dev` natively on :5173 for HMR. Bring this up
  # only when you need to validate the production bundle/proxy setup:
  #   docker compose up -d --build frontend-acm
  # Visit http://localhost:5174/. /api/* is proxied to the host's
  # NestJS dev server via host.docker.internal:4009 — no backend container
  # is required.
  frontend-acm:
    build:
      context: ./frontend-acm
      dockerfile: Dockerfile
    image: acm-frontend:dev
    container_name: acm-frontend
    restart: unless-stopped
    ports:
      - '5174:80'
    environment:
      # nginx /api/ proxies here. Host's native NestJS dev server runs on 4009.
      ACM_BACKEND_UPSTREAM: backend:4009
    extra_hosts:
      # Lets the upstream `backend` referenced by nginx.conf resolve to the
      # docker host. Works on Docker Desktop (mac/win) and Linux 20.10+.
      - 'backend:host-gateway'

volumes:
  tac-redis-data:
  acm-pg-data:
