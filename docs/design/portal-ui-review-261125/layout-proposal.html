<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학원포털 수정 구성 시안</title><style>
:root{--accent:#4f46e5;--ink:#18243a;--line:#dce2ea;--muted:#526078}*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:var(--ink);font:15px/1.55 -apple-system,'Apple SD Gothic Neo',sans-serif}button,select,input{font:inherit}button,a,select{min-height:44px}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;padding:8px 14px;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8378f5;outline-offset:2px}.review{padding:16px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px;background:#15253d;color:white}.review h1{font-size:17px;margin:0}.review p{margin:0;font-size:12px;color:#ccd7e7}.review label{font-size:13px;display:flex;gap:8px;align-items:center}.review select{border-radius:6px;padding:6px}.frame{max-width:1440px;margin:24px auto;background:#f6f8fb;border:1px solid var(--line);border-radius:12px;overflow:hidden;container-type:inline-size}.header{min-height:56px;background:white;padding:8px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}.header strong{font-size:17px}.grow{flex:1}.role,.badge{font-size:12px;padding:3px 8px;border-radius:6px;background:#edf0f6;color:var(--muted)}.headtools{display:flex;gap:8px;align-items:center}.body{display:flex;min-height:640px}.side{width:240px;flex:none;border-right:1px solid var(--line);padding:18px 12px;background:white}.side button{display:flex;align-items:center;gap:10px;border:0;text-align:left;width:100%;margin-bottom:5px}.side button.on,.bottom button.on{color:#3730a3;background:#eef2ff;font-weight:700}.nav-icon{width:22px;text-align:center;font-size:18px}main{padding:24px;flex:1;min-width:0}.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}h2{font-size:24px;margin:0}h3{font-size:17px;margin:0 0 14px}p{margin:8px 0}.hint{font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}.toolbar select,.toolbar input{min-height:44px;max-width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:white}.toolbar .selected{color:#3730a3;background:#eef2ff;border-color:#c7d2fe}.surface{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;margin:16px 0}.row{display:flex;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row time{font-weight:700;width:64px}.row .marker{width:4px;height:42px;border-radius:3px;background:#4f46e5}.row .marker.cyan{background:#0891b2}.row p{margin:0}.chips{display:flex;gap:8px;margin:16px 0}.chips button{flex:1;min-width:0;padding:6px}.chips b{display:block}.chips .on{background:var(--accent);color:white;border-color:var(--accent)}.bottom{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.grid .surface{margin:0}.avatar{width:42px;height:42px;border-radius:50%;background:#e0e7ff;color:#4338ca;display:inline-grid;place-items:center;margin-right:10px;font-weight:700}.student-name{display:flex;align-items:center}.student-name span:last-child{margin-left:auto}.muted{color:var(--muted)}.empty{padding:24px;text-align:center;border:1px dashed #c7d1de;border-radius:8px}.account{max-width:680px}.table{width:100%;border-collapse:collapse;text-align:left}.table th,.table td{padding:12px;border-bottom:1px solid var(--line)}.table th{font-size:13px;color:var(--muted)}.sidenote{margin:12px 0;color:var(--muted);font-size:13px}.previewnote{padding:10px 24px;background:#fff9ed;color:#765318;font-size:13px}dialog{border:1px solid var(--line);border-radius:12px;max-width:90vw;min-width:260px}dialog::backdrop{background:#13243e88}dialog button{display:block;width:100%;margin:8px 0}.width375{max-width:375px}.width768{max-width:768px}@container(max-width:1023px){.side{width:76px;padding:16px 8px}.side .label{display:none}.side button{justify-content:center;padding:8px}.table .optional{display:none}}@container(max-width:639px){.header{padding:8px 12px}.header .role,.header .lang{display:none}.headtools{gap:4px}.body{min-height:560px}.side{display:none}main{padding:16px 12px}.bottom{display:flex;position:sticky;bottom:0;background:white;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}.bottom button{flex:1;border:0;border-radius:0;padding:8px 2px;font-size:11px;min-width:0}.bottom .nav-icon{display:block;margin:auto}.row{gap:10px}.surface{padding:14px}.page-head h2{font-size:21px}.table th,.table td{padding:9px 5px;font-size:12px}.grid{grid-template-columns:1fr}.previewnote{padding:10px 12px}.chips{gap:4px}.chips button{font-size:12px;padding:5px 1px}}@media(max-width:640px){.frame{margin:12px 0;border-radius:0}.review{padding:14px;gap:12px}}
</style></head><body>
<div class="review"><div><h1>학원포털 · 수정 구성 시안</h1><p>검토용 가상 데이터 · 운영 기능 구현본이 아닙니다</p></div><label>역할 <select id="role"><option value="teacher">강사</option><option value="student">학생</option></select></label><label><input id="notices" type="checkbox"> 선택 역할의 공지 표시</label><label>화면 <select id="width"><option value="">자동</option><option value="width768">태블릿 768</option><option value="width375">모바일 375</option></select></label><a href="index.html" style="color:white">개선안 읽기</a></div>
<div class="frame" id="frame"><header class="header"><strong>학원 포털</strong><span class="role" id="roleLabel">강사</span><span class="grow"></span><div class="headtools"><button id="bell" aria-label="알림">알림</button><select class="lang" aria-label="언어"><option>한국어</option><option>English</option><option>Tiếng Việt</option><option>简体中文</option></select><button id="profile">내 정보</button></div></header><div class="previewnote">권한을 넓히지 않고 정보 배치와 탐색을 개선한 구성안입니다.</div><div class="body"><nav class="side" aria-label="주 메뉴" id="side"></nav><main id="content"></main></div><nav class="bottom" id="bottom" aria-label="모바일 메뉴"></nav></div>
<dialog id="more"><h3>더보기</h3><div id="extra"></div><button id="closeMore">닫기</button></dialog>
<script>
const labels={calendar:'수업일정',students:'수강생관리',materials:'자료실',chat:'채팅',notices:'공지사항',links:'수업링크',me:'마이페이지'};
const icons={calendar:'▦',students:'♙',materials:'▤',chat:'☏',notices:'♧',links:'↗',me:'○',more:'•••'};
const state={role:'teacher',notice:{teacher:false,student:false},page:'calendar',all:false};
const byId=id=>document.getElementById(id);
function menus(){const base=state.role==='teacher'?['calendar','students','materials','chat']:['links','materials'];if(state.notice[state.role])base.push('notices');return base.concat('me')}
function navButton(key,short=false){const name=key==='more'?'더보기':labels[key];return '<button data-page="'+key+'" class="'+(state.page===key?'on':'')+'" '+(state.page===key?'aria-current="page"':'')+' aria-label="'+name+'" title="'+name+'"><span class="nav-icon" aria-hidden="true">'+icons[key]+'</span><span class="label">'+(short&&key==='students'?'수강생':short&&key==='calendar'?'일정':short&&key==='me'?'마이':name)+'</span></button>'}
function render(){
const list=menus();if(!list.includes(state.page))state.page=list[0];
byId('side').innerHTML=list.map(k=>navButton(k)).join('');
const bottom=state.role==='teacher'?['calendar','students','materials','chat','more']:list;
byId('bottom').innerHTML=bottom.map(k=>navButton(k,true)).join('');
byId('roleLabel').textContent=state.role==='teacher'?'강사':'학생';
byId('notices').checked=state.notice[state.role];byId('bell').hidden=state.role!=='teacher';
byId('content').innerHTML=content();
}
function content(){
const head='<div class="page-head"><h2>'+labels[state.page]+'</h2></div>';
if(state.page==='calendar')return head+'<div class="toolbar"><button aria-label="이전 날짜">‹</button><strong>2026년 11월 25일</strong><button aria-label="다음 날짜">›</button><button>오늘</button></div><div class="toolbar"><button>월</button><button>주</button><button>일</button><button class="selected">목록</button><span class="grow"></span><select aria-label="학생 필터"><option>학생 전체</option><option>가학생</option></select><select aria-label="수업종류"><option>수업종류 전체</option><option>정규수업</option><option>데모수업</option></select></div><div class="chips"><button><span>일</span><b>22</b></button><button><span>월</span><b>23</b></button><button><span>화</span><b>24</b></button><button class="on"><span>수</span><b>25</b></button><button><span>목</span><b>26</b></button><button><span>금</span><b>27</b></button><button><span>토</span><b>28</b></button></div><section class="surface"><h3>오늘 수업 · 예시 2건</h3><div class="row"><time>10:00</time><span class="marker"></span><div><strong>가학생</strong><p class="hint">정규수업 · 대면 · 50분</p></div></div><div class="row"><time>14:00</time><span class="marker cyan"></span><div><strong>나학생</strong><p class="hint">데모수업 · 비대면 · 30분</p></div></div></section><p class="sidenote">목록 구성 시안입니다. 기간·보기·필터 조작은 이 검토본에서 실제 조회하지 않습니다.</p>';
if(state.page==='students'){const names=state.all?['가학생','나학생','다학생']:['가학생','나학생'];return head+'<div class="toolbar"><button id="assigned" class="'+(!state.all?'selected':'')+'">내 담당 2</button><button id="allStudents" class="'+(state.all?'selected':'')+'">전체보기(퇴원 포함) 3</button></div><p class="hint">두 목록 모두 내 담당 학생 범위입니다.</p><div class="grid">'+names.map((n,i)=>'<article class="surface"><div class="student-name"><span class="avatar">'+n[0]+'</span><strong>'+n+'</strong><span class="badge">'+(i===2?'퇴원':'재원')+'</span></div><p class="hint">예시학교 · 5학년 · 영어</p></article>').join('')+'</div><p class="sidenote">다음 수업·메시지 단축 행동은 데이터와 권한 확인 후 확장합니다.</p>'}
if(state.page==='materials')return head+'<div class="toolbar"><button class="selected">공유받은 게시물</button><button>내 게시물</button></div><section class="surface"><table class="table"><thead><tr><th>제목</th><th>유형</th><th>상태</th><th class="optional">등록일</th></tr></thead><tbody><tr><td>읽기 연습 자료</td><td>자료</td><td>공유됨</td><td class="optional">11.25</td></tr><tr><td>수업 과제</td><td>문서</td><td>제출 대기</td><td class="optional">11.24</td></tr></tbody></table></section><p class="hint">실제 적용은 모바일 목록으로 전환하고 항목별 권한에 맞는 작업을 제공합니다.</p>';
if(state.page==='me')return head+'<div class="account"><section class="surface"><h3>계정 정보</h3><p>예시 사용자 · '+(state.role==='teacher'?'강사':'학생')+'</p><p class="hint">user@example.com</p></section><section class="surface"><h3>보안</h3><p>비밀번호 변경 · 로그아웃 진입</p></section><p class="hint">사용자 지정 타임존은 표시하지 않습니다. 기기 알림은 지원 역할·환경에서만 제공합니다.</p></div>';
if(state.page==='links')return head+'<section class="surface"><h3>연결된 수업</h3><p>가학생 · 영어</p><p class="hint">수업 입장과 상세 정보는 기존 지원 기능으로 연결합니다.</p></section>';
if(state.page==='notices')return head+'<section class="surface"><h3>학원 안내 · 예시</h3><p>선택 역할의 테넌트 공지 설정이 켜진 경우만 표시합니다.</p></section>';
return head+'<section class="surface"><h3>대화 목록 → 대화방</h3><p>데스크톱은 2열, 모바일은 목록과 대화방을 나누어 보여줍니다.</p><p class="hint">실제 채팅 동작은 첨부 목업 캡처와 개선안 8장을 참고합니다.</p></section>';
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){const key=nav.dataset.page;if(key==='more'){byId('extra').innerHTML=(state.notice.teacher?navButton('notices'):'')+navButton('me');byId('more').showModal()}else if(menus().includes(key)){state.page=key;byId('more').close();render()}return}if(e.target.id==='assigned'){state.all=false;render()}if(e.target.id==='allStudents'){state.all=true;render()}});
byId('role').onchange=e=>{state.role=e.target.value;state.page=menus()[0];state.all=false;render()};
byId('notices').onchange=e=>{state.notice[state.role]=e.target.checked;render()};
byId('width').onchange=e=>byId('frame').className='frame '+e.target.value;
byId('profile').onclick=()=>{state.page='me';render()};
byId('closeMore').onclick=()=>byId('more').close();
render();
</script></body></html>
